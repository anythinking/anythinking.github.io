<text x="30" y="958" font-size="13.5" fill="#4a4540">읽는 법 — Miller 2010의 잣대는 「논리 소자가 되려면」의 기준이라 위 두 줄에 맞춰져 있다. 아래 네 줄(아날로그 연산)은 1960년대부터 있었지만, 2010년 이후 집적 광학과 AI 수요로 크게 늘었다.</text>
<text x="30" y="980" font-size="13.5" fill="#4a4540">셋째 축(전자와 어디서 만나나 — 전광 / O-E-O / 전자 계산+광 I/O)은 점마다 섞여 있어 그림에 넣지 않았다. 리저버 보정(2025)처럼 줄 사이를 잇는 결과가 지금 새로 나오는 자리다.</text>
