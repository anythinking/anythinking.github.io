<text x="970" y="1028" font-size="12" fill="#64748b">점선 = 연구실 → 회사 (B 노트 「산업 연결」)</text>
<rect x="150" y="1050" width="423" height="128" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
<text x="162" y="1072" font-size="14" font-weight="700" fill="#92400e">① CPO는 왜 지금 오나</text>
<text x="162" y="1094" font-size="12" fill="#374151">파란 점선 상자(패키지 층 2019~2026):</text>
<text x="162" y="1111" font-size="12" fill="#374151">표준 먼저(A15 협의체·A21 외장 레이저) →</text>
<text x="162" y="1128" font-size="12" fill="#374151">병목 부품이 양산·인수 대상(A37·A38) →</text>
<text x="162" y="1145" font-size="12" fill="#374151">스위치 제품(A30·A33). 단 A37은 제한</text>
<text x="162" y="1162" font-size="12" fill="#374151">시험 생산 단계(R8), A30은 일정 발표(C5).</text>
<rect x="583" y="1050" width="423" height="128" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
<text x="595" y="1072" font-size="14" font-weight="700" fill="#92400e">② Lightmatter는 왜 연결 쪽인가</text>
<text x="595" y="1094" font-size="12" fill="#374151">뿌리는 연산(A13, G1 연구실) → 2025 연산</text>
<text x="595" y="1111" font-size="12" fill="#374151">칩 실증(A31)과 같은 해 연결 제품(A34).</text>
<text x="595" y="1128" font-size="12" fill="#374151">제품 페이지 전면은 연결(C1). 같은 방향:</text>
<text x="595" y="1145" font-size="12" fill="#374151">Lightelligence·Salience(A39, R6). 단 「전략</text>
<text x="595" y="1162" font-size="12" fill="#374151">이동」 자체는 미확인, 표본 세 곳.</text>
<rect x="1017" y="1050" width="423" height="128" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
<text x="1029" y="1072" font-size="14" font-weight="700" fill="#92400e">③ 5그룹 중 EO 축은 어디</text>
<text x="1029" y="1094" font-size="12" fill="#374151">초록 마름모 = EO: G1·G2·G4·G5.</text>
<text x="1029" y="1111" font-size="12" fill="#374151">G5는 본문 4편으로 재판정(2021~ 텐서 코어</text>
<text x="1029" y="1128" font-size="12" fill="#374151">계열 EO, 가중치는 주로 PCM). 빨강 = 전광:</text>
<text x="1029" y="1145" font-size="12" fill="#374151">G3(센서 앞단, 스택 밖). 파랑·회색 X1~X4는</text>
<text x="1029" y="1162" font-size="12" fill="#374151">연산이 아닌 연결·광원 축.</text>
<text x="40" y="1202" font-size="11" fill="#888">가설(결론 아님): 「연결은 광이 이기고 연산은 아직」. 회색 네모(A6·A10·A23·A24·A25)가 그 가설의 「연결」 쪽도 층마다 다르다는 반증이다 — 랙 안은 2024년에도 구리(A25·R1). 2026-11-25 생성 · 11-26 G5 재판정·인용 보강.</text>
