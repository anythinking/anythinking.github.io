<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DMD 거울 배열</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1340px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
.am-row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.am-row>.iso-figure{flex:1 1 380px;min-width:0;margin:0}
.am-row>.iso-figure:first-child{flex-grow:1.4}
.am-row>.b-fig{order:-1;flex:1 1 100%}
.z-stage svg{overflow:hidden}
.iso{--dmd-off:#c3c3bf;--dmd-light:#000}
.iso[data-theme="dark"]{--dmd-off:#0b0b0b;--dmd-light:#fff}
.dmd-off{fill:var(--dmd-off);stroke:none}
.dmd-on{fill:var(--anatomy-lit-top)}
.dmd-light{fill:var(--dmd-light);opacity:.045;stroke:none}

true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>켜진 거울(+12°)과 렌즈로 가는 반사광 · 꺼진 거울(−12°)의 빛은 덤프로</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>선택된 워드라인(행)과 1을 싣는 데이터선(열): SRAM만 바뀌고 거울은 그대로</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>리셋 버스가 깜빡이는 순간 전체 거울이 동시에 넘어간다 · 눈금자 = 한 프레임 15칸</span></span><span class="iso-caption">거울마다 아래에 SRAM 1비트가 있다. 행 디코더가 한 번에 한 행을 골라 열 래치의 비트를 그 행 SRAM에 쓰는 동안 거울은 움직이지 않고, 전 행이 다 써진 뒤 리셋 펄스가 오면 모든 거울이 동시에 새 비트 쪽으로 넘어가 착지한다. 회색은 시간으로 만든다: 4비트 값 11(1011₂)이면 비트 0·1·3 플레인 동안 켜져 15칸 중 1+2+8 = 11칸 빛을 렌즈로 보낸다. 실제 TI DLP 거울은 피치 약 5.4–10.8 µm, 기울기 ±12°(일부 세대 ±17°), 전환은 수 µs이고, 60 Hz 8비트 영상이면 가장 짧은 플레인이 16.7 ms의 1/255 ≈ 65 µs다. 여기서는 한 행 쓰기를 0.13초, 비트 0 플레인을 1.1초로 늘렸다. LCD는 화소 커패시터에 아날로그 전압을 붙잡아 밝기를 정하고, DMD는 1비트만 붙잡고 켜져 있는 시간으로 밝기를 만든다. 창 유리는 생략했다.</span></figcaption></figure><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 3</span><span class="iso-plate-corner" data-corner="title">소자 확대 · 3행 3열</span><span class="iso-plate-corner" data-corner="hint">거울은 기둥을 늘려 들어 올렸다</span><span class="iso-plate-corner" data-corner="readout" data-readout>SRAM 1 · 거울 +12° 켜짐</span></div><div class="iso-stage z-stage" role="img" aria-label="선택한 거울 화소의 층 구조 확대"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 460 500" role="img" aria-label="거울 화소 하나를 확대한 모습. CMOS 다이 위에 SRAM 셀, 그 두 출력에 이어진 주소 전극 두 개, 착지 패드, 경첩 기둥 두 개가 있다. 기둥 사이 비틀림 경첩에 요크가 매달려 기울고, 요크 가운데 기둥이 거울을 받친다. 거울은 아래층이 보이도록 기둥을 늘려 들어 올렸다. 주변 화소는 거울을 떼고 흐리게 보인다."><defs><filter id="dsoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>

291.3 398.5L168.3 418.5L167.6 415.9Z"/></g></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>SRAM 출력이 걸린 주소 전극과 SRAM의 Q 쪽 점 · 리셋 때 경첩 기둥</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>거울 → 기둥 → 요크·착지 팁 → 비틀림 경첩 → 주소 전극 두 개 → SRAM(CMOS)</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>주변 8화소는 거울을 떼어 내고 흐리게</span></span><span class="iso-caption">SRAM 셀의 두 출력(Q와 그 반전 출력)이 요크 양옆의 주소 전극 두 개에 서로 반대 전압을 건다. 거울과 요크에는 경첩 기둥을 통해 바이어스가 걸려 있어, 착지한 거울은 주소 전극이 바뀌어도 그대로 붙어 있다(전기기계적 래치). 리셋 펄스가 바이어스를 흔들면 거울이 풀려나고, 정전기력이 센 쪽 전극으로 기울어 요크 끝의 스프링 팁이 착지 패드에 닿으며 ±12°에서 멈춘다. 그래서 SRAM에 쓰는 순간과 거울이 넘어가는 순간이 분리되고, 전 화면이 한 번에 바뀐다. SRAM은 실제로는 전극 바로 아래 CMOS 층에 있다 — 보이도록 경첩 앞쪽에 꺼내 그렸고, 거울 기둥도 늘려 그렸다.</span></figcaption></figure><figure class="iso-figure b-fig"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">DMD 광학 벤치</span><span class="iso-plate-corner" data-corner="hint">빛: 레이저 → 확대 → DMD(24° 입사) → 렌즈 → 스크린</span><span class="iso-plate-corner" data-corner="readout" data-readout></span></div><div class="iso-stage b-stage" role="img" aria-label="DMD 광학 벤치 전체"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 820 470" role="img" aria-label="광학 브레드보드 위 DMD 실험 구성. 오른쪽 뒤 레이저 빛이 대물렌즈와 시준 렌즈로 7배 넓어져 DMD에 법선에서 24° 기울어 들어간다. 켜진 거울(+12°)의 빛은 법선 방향으로 결상 렌즈를 지나 스크린에 상을 맺고, 꺼진 거울(−12°)의 빛은 48° 쪽 광 덤프로 간다."><path class="iso-halo" d="M46.6 176.4L46.7 175.5L47.2 174.6L48 17     if (b === 0) img = loadImg;

  }
  if (written === 0 && tin >= RESET_T) loadImg = nb === 0 ? nextImg : img;
  const row = tin >= RESET_T ? Math.floor((tin - RESET_T) / ROW_T) : -1;
  while (written < ROWS && written <= row) { writeRow(written, nb, loadImg); written++; }
  if (b === 0 && tin < 0.05 && touring) nextImg = (img + 1) % IMAGES.length;
  const flash = tin < RESET_T ? Math.pow(1 - tin / RESET_T, 2) : 0;
  phase = { b, tin, row: row >= 0 && row < ROWS ? row : -1, nb, ft, flash };

  const e = 1 - Math.exp(-dt / 0.05);
  for (let r = 0; r < ROWS; r++) wordO[r] += ((r === phase.row ? 1 : 0) - wordO[r]) * e;
  for (let c = 0; c < COLS; c++) dataO[c] += ((phase.row >= 0 && bit(IMAGES[loadImg][phase.row][c], nb) ? 1 : 0) - dataO[c]) * e;

function draw() {

      drawnA[i] = ang[i];

      beamOn[i].style.opacity = (f * f * 0.32).toFixed(3);

  for (let c = 0; c < COLS; c++) dataLit[c].style.opacity = (dataO[c] * 0.85).toFixed(3);
  for (let p = 0; p < 4; p++) planeLit[p].style.opacity = planeO[p].toFixed(3);

  slider.setAttribute("transform", "translate(" + (SLIDE[0] * u).toFixed(2) + " " + (SLIDE[1] * u).toFixed(2) + ")");
  const w = (b) => "(" + (1 << b) + "/15)";
  const text = phase.tin < RESET_T ? "리셋 — 전체 거울 전환"
    : phase.row >= 0 ? "비트 " + phase.nb + " " + w(phase.nb) + " 적재 중 · " + (phase.row + 1) + "행"

function tick(now) {

const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };

const touch = () => { touring = false; nextImg = img; clearTimeout(idle); idle = setTimeout(() => { touring = true; }, 6000); };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

const pick = (i) => { focus = i; focusEl.setAttribute("d", OUTLINES[i]); touch(); zoomDraw(0); };
stage.addEventListener("click", (event) => {
  const box = svg.getBoundingClientRect();
  const sx = (event.clientX - box.left) / box.width * 640, sy = (event.clientY - box.top) / box.height * 470;
  let best = -1, bd = 16;
  MIRROR_SCREEN.forEach(([x, y], i) => { const d = Math.hypot(sx - x, (sy - y) * 1.6); if (d < bd) { bd = d; best = i; } });

stage.addEventListener("keydown", (event) => {
  const r = Math.floor(focus / COLS), c = focus % COLS;

  else if (event.key === "ArrowLeft") pick(r * COLS + Math.max(0, c - 1));
  else if (event.key === "ArrowDown") pick(Math.min(ROWS - 1, r + 1) * COLS + c);
  else if (event.key === "ArrowUp") pick(Math.max(0, r - 1) * COLS + c);

const ZP = {"origin":[230,256.5970229225889],"scale":4.518720704530824,"azimuth":45,"elevation":40};
const Z_PITCH = 30, Z_HALF = 13.5, Z_PIV = 3.7, Z_ZM = 24;
const Z_TIP = [2.9,3.85], Z_YOKE = [3.85,4.45];
const zsvg = document.querySelector(".z-stage svg");
const zreadout = document.querySelectorAll("[data-readout]")[1];
const ztitle = document.querySelectorAll('[data-corner="title"]')[1];
const zCells = [...Array(9)].map((_, i) => zsvg.querySelector('[data-zcell="' + i + '"]'));
const zMov = [...Array(9)].map((_, i) => zsvg.querySelector('[data-zmov="' + i + '"]'));
const zElL = zsvg.querySelector('[data-z="el-l"]'), zElR = zsvg.querySelector('[data-z="el-r"]');
const zQ = zsvg.querySelector('[data-z="q"]'), zQb = zsvg.querySelector('[data-z="qb"]');
const zPosts = [...zsvg.querySelectorAll('[data-z="post-lit"]')];
const zWord = zsvg.querySelector('[data-z="word"]'), zData = zsvg.querySelector('[data-z="data"]');
const zDrawn = Array(9).fill(NaN);
let zFocusDrawn = -1, zBit = 1;
const zhp = (h, t, ox, oy) => [ox + (h + t) * Math.SQRT1_2, oy + (h - t) * Math.SQRT1_2];
const zrect = (h0, h1, t0, t1, ox, oy) => [zhp(h0, t0, ox, oy), zhp(h1, t0, ox, oy), zhp(h1, t1, ox, oy), zhp(h0, t1, ox, oy)];
function zMoving(ox, oy, a, full) {
  const th = -a * Math.PI / 180, pv = [ox, oy, Z_PIV];
  let s = tiltSvg(zrect(-1, 1, -11, -10, ox, oy), Z_TIP[0], Z_TIP[1], pv, th, ZP, { tone: "mid" });
  s += tiltSvg(zrect(-1, 1, 10, 11, ox, oy), Z_TIP[0], Z_TIP[1], pv, th, ZP, { tone: "mid" });
  s += tiltSvg(zrect(-3.5, 3.5, -11, 11, ox, oy), Z_YOKE[0], Z_YOKE[1], pv, th, ZP, { tone: "hi", crease: "lo" });
  if (full) {
    s += tiltSvg(zrect(-1.2, 1.2, -1.2, 1.2, ox, oy), Z_YOKE[1], Z_ZM, pv, th, ZP, { tone: "mid" });
    const m = [[ox - Z_HALF, oy - Z_HALF], [ox + Z_HALF, oy - Z_HALF], [ox + Z_HALF, oy + Z_HALF], [ox - Z_HALF, oy + Z_HALF]];
    s += tiltSvg(m, Z_ZM, Z_ZM + 0.8, pv, th, ZP, { on: Math.max(0, Math.min(1, (a + TILT) / (2 * TILT))), tone: "hi", dimple: 1.6 });

function zoomDraw(dt) {
  const fr = Math.floor(focus / COLS), fc = focus % COLS;

    for (let i = 0; i < 9; i++) {
      const r = fr + Math.floor(i / 3) - 1, c = fc + (i % 3) - 1;
      zCells[i].style.display = r < 0 || r >= ROWS || c < 0 || c >= COLS ? "none" : "";
      zDrawn[i] = NaN;
    }
    ztitle.textContent = "소자 확대 · " + (fr + 1) + "행 " + (fc + 1) + "열";
    zFocusDrawn = focus;
  }
  for (let i = 0; i < 9; i++) {
    const r = fr + Math.floor(i / 3) - 1, c = fc + (i % 3) - 1;
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
    const a = ang[r * COLS + c];
    if (!(Math.abs(a - zDrawn[i]) <= 0.02)) {
      zMov[i].innerHTML = zMoving(((i % 3) - 1) * Z_PITCH, (Math.floor(i / 3) - 1) * Z_PITCH, a, i === 4);

  zElR.style.opacity = (1 - zBit).toFixed(3);
  zQ.style.opacity = zBit.toFixed(3);
  zQb.style.opacity = (1 - zBit).toFixed(3);
  for (const el of zPosts) el.style.opacity = phase.flash.toFixed(3);

  const text = phase.tin < RESET_T && freeM[focus] ? "리셋 펄스 · 거울 해제 → " + st(side[focus]) + " 착지"
    : phase.tin < RESET_T ? "리셋 펄스 · " + st(side[focus]) + " 그대로 재착지"

    : "SRAM " + b + " · 거울 " + st(a) + (a > 0 ? " 켜짐" : " 꺼짐") + " · 값 " + v + "/15";
  if (zreadout.textContent !== text) zreadout.textContent = text;
}

const bsvg = document.querySelector(".b-stage svg");
const bread = document.querySelectorAll("[data-readout]")[2];
const bMir = [...bsvg.querySelectorAll("[data-bm]")];
