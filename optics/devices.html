<script type="application/json" id="data-devices">{"DEV":{"src-cw":{"n":"레이저 광원","g":"만든다","d":"일정한 세기로 계속 빛을 내보낸다. 연산의 「전원」이고, 선폭과 세기 안정도가 그대로 계산 정밀도의 바닥이 된다."},"src-comb":{"n":"주파수 콤 광원","g":"만든다","d":"균일한 간격의 파장 수십~수백 개를 한 번에 낸다. 파장 하나가 채널 하나라 병렬도를 공짜로 준다."},"src-pulse":{"n":"펄스 레이저","g":"만든다","d":"짧은 펄스를 일정 주기로 낸다. 시간 슬롯 하나가 값 하나가 되는 구조의 클럭."},"amp":{"n":"광증폭기","g":"만든다","d":"빛을 빛인 채로 키운다. 단을 거칠수록 깎이는 손실을 되살리는 유일한 수단이고, 잡음(ASE)이 대가다."},"bs":{"n":"빔 분할기 (2×2 결합기)","g":"나눈다·합친다","d":"두 길을 섞어 반반으로 나눈다. 간섭이 일어나는 자리이고, MZI의 앞뒤를 이것 둘이 맡는다."},"ysplit":{"n":"Y 분기 · 1×N 분배","g":"나눈다·합친다","d":"한 줄기를 N 갈래로 고르게 뿌린다. 입력 벡터를 모든 가지에 같이 먹이는 자리."},"wdm":{"n":"파장 분배기","g":"나눈다·합친다","d":"섞여 온 파장들을 포트별로 가른다(또는 합친다). 파장에 값을 실은 구조에서 「열」을 가르는 부품."},"pbs":{"n":"편광 분할기","g":"나눈다·합친다","d":"편광 두 축을 갈라 각각 다른 길로 보낸다. 편광을 자유도로 쓰는 구조에서만 필요하다."},"ps":{"n":"위상 천이기","g":"바꾼다 (손잡이)","d":"한 팔의 위상만 민다. 세기를 안 건드리고 간섭 결과만 바꾸기 때문에, 가중치를 위상에 싣는 구조에서는 이것 하나가 곧 손잡이 하나다."},"eom":{"n":"EO 변조기","g":"바꾼다 (손잡이)","d":"전기 신호로 빛의 세기를 흔든다. 전자 쪽 숫자를 빛에 올리는 입구이고, 속도와 Vπ가 데이터를 얼마나 빨리 밀어넣느냐를 정한다."},"voa":{"n":"가변 감쇠기","g":"바꾼다 (손잡이)","d":"세기를 깎는다. 유니터리만으로는 안 되는 임의 행렬의 대각 성분이 여기서 나온다."},"ring":{"n":"링 공진기","g":"바꾼다 (손잡이)","d":"특정 파장에서만 공진한다. 공진에서 얼마나 벗어나 있느냐가 투과율이 되어 그 값이 가중치가 된다 — 대신 온도에 묶인다."},"pcm":{"n":"상변화 셀","g":"저장한다","d":"재료의 결정/비정질 상태가 굴절률을 바꾸고, 전원을 끊어도 그 상태가 남는다. 가중치를 비휘발로 들고 있는 거의 유일한 길."},"nvm":{"n":"비휘발 광 메모리","g":"저장한다","d":"전압을 끊어도 굴절률 변화가 남는 소자. 히터를 계속 켜두는 정적 전력을 없애려는 자리."},"delay":{"n":"지연선","g":"저장한다","d":"빛을 한 바퀴 돌려 시간만큼 붙잡아 둔다. 값을 시간 슬롯에 보관하는 구조의 메모리."},"freq":{"n":"주파수 변환기","g":"섞는다 (비선형)","d":"파장을 다른 파장으로 옮기거나 둘을 더한다(χ²). 연산 그 자체보다 광원·양자광원·위상민감 증폭을 만드는 데 쓰인다."},"kerr":{"n":"커 매질","g":"섞는다 (비선형)","d":"세기에 따라 굴절률이 변한다(χ³). 빛이 빛을 제어하는 비선형성의 출처이고, 전광 논리와 콤 생성의 바닥."},"sa":{"n":"포화 흡수체","g":"섞는다 (비선형)","d":"약한 빛은 먹고 센 빛은 통과시킨다. 문턱을 만드는 소자라 스파이킹·펄스 정형에 쓰인다."},"slm":{"n":"공간광변조기 (SLM)","g":"자유공간","d":"화소마다 위상이나 세기를 따로 바꾼다. 큰 행렬을 한 장에 올릴 수 있지만 한 장 갱신이 밀리초다."},"mask":{"n":"위상 마스크 (회절판)","g":"자유공간","d":"자리마다 위상을 다르게 미는 고정판. 가중치가 여기 새겨져 있고 바꾸려면 다시 찍어야 한다."},"meta":{"n":"메타표면","g":"자유공간","d":"파장보다 작은 구조를 배열해 한 장 두께로 위상·편광·분산을 설계한다. 4f 광학계 한 벌을 판 한 장으로 압축하는 자리."},"lens":{"n":"렌즈 · 4f 광학계","g":"자유공간","d":"푸리에 변환을 통과만으로 끝낸다. 자유공간 구조에서 「층과 층 사이」를 맡는 배관."},"cam":{"n":"이미지 센서","g":"자유공간","d":"출력면의 세기 분포를 한 번에 읽는다. 자유공간 구조의 출력단이고, 프레임레이트가 처리량을 정한다."},"pd":{"n":"광검출기","g":"읽는다","d":"빛의 세기를 전류로 바꾼다. 제곱이 되면서 부호가 사라지는 자리라, 음수 가중치를 쓰려면 읽는 방식을 바꿔야 한다."},"bal":{"n":"밸런스드 검출기","g":"읽는다","d":"기준 빛과 섞어 두 검출기의 차를 읽는다. 위상 정보가 세기로 번역돼 음수와 복소수가 되살아난다."},"spd":{"n":"단일광자 검출기","g":"읽는다","d":"광자 하나를 센다. 광자 수가 곧 결과인 양자 구조에서만 필요하다."},"tia":{"n":"TIA (전류→전압)","g":"읽는다","d":"광전류를 읽을 수 있는 전압으로 키운다. 눈에 안 띄지만 시스템 에너지와 잡음의 큰 몫이 여기 있다."},"adc":{"n":"ADC · DAC","g":"읽는다","d":"아날로그와 디지털 사이를 오간다. 광 가속기 시스템 에너지의 대부분을 이 변환이 먹는다 — 「변환 앞에서 끝낸다」가 겨냥하는 과녁."},"wg":{"n":"도파관","g":"잇는다","d":"빛을 가두어 나른다. 플랫폼(SOI·SiN·TFLN·InP)이 여기서 정해지고, 그 선택이 위에 올릴 수 있는 소자를 가둔다."},"coup":{"n":"격자·엣지 결합기","g":"잇는다","d":"칩 밖 광섬유와 칩 안 도파관을 잇는다. 모드 크기가 달라 여기서 빛을 크게 잃는다."},"farr":{"n":"광섬유 어레이","g":"잇는다","d":"광섬유 여러 가닥을 나란히 고정해 칩에 맞댄다. 정렬이 µm 단위라 조립비가 비싸다."},"iso":{"n":"아이솔레이터","g":"잇는다","d":"빛을 한 방향으로만 통과시킨다. 되돌아온 빛이 레이저를 흔드는 걸 막는다."},"qsrc":{"n":"쌍광자원 (양자광원)","g":"만든다","d":"광자를 하나씩, 또는 얽힌 쌍으로 내보낸다. 「빛을 세기로 쓰지 않고 광자 수로 쓰는」 구조의 입구이고, 한 번에 몇 개가 나오느냐가 확률적이라는 게 이 분야의 벽."},"cav":{"n":"공진 캐비티 (나노·마이크로)","g":"바꾼다 (손잡이)","d":"빛을 아주 작은 부피에 오래 가둔다. 부피를 줄일수록 같은 효과를 내는 데 드는 에너지가 줄어서, 전광 논리의 에너지 벽을 낮추는 길이 전부 여기로 모인다."},"seed":{"n":"흡수 변조 다이오드 (SEED형)","g":"바꾼다 (손잡이)","d":"빛을 받으면 전압이 변하고, 그 전압이 다시 흡수를 바꾼다. 검출기와 변조기가 한 몸이라 전원에서 이득을 꺼내 쓸 수 있는 게 핵심 — 순수 전광이 못 한 일."},"spec":{"n":"분광기","g":"읽는다","d":"파장별 세기를 한 번에 펼쳐 읽는다. 값이 파장에 실린 구조에서 출력 벡터를 통째로 읽는 자리."},"bias":{"n":"바이어스 전원","g":"전자 쪽","d":"소자를 동작점에 앉혀 둔다. 전광 논리에서 「이득을 어디서 꺼내 오나」의 답이 대개 이것이다 — 빛이 아니라 전원이 에너지를 댄다."},"fpga":{"n":"전자 되먹임·제어 (FPGA·ASIC)","g":"전자 쪽","d":"한 바퀴 결과를 받아 다음 바퀴 입력을 만든다. 광 루프가 아무리 빨라도 이 왕복 지연이 길면 그 속도가 안 나온다."},"lock":{"n":"안정화 루프 (온도·위상 락킹)","g":"전자 쪽","d":"공진 파장이나 위상각을 제자리에 붙잡는다. 칩 온도가 1도만 변해도 가중치가 통째로 밀리기 때문에, 없으면 계산이 유지되지 않는다."},"rf":{"n":"RF 안테나·전치증폭기","g":"전자 쪽","d":"마이크로파 신호를 받아 빛에 실을 수 있게 만든다. 입력이 빛이 아니라 전파인 구조의 입구."},"rtd":{"n":"흥분성 전자 소자 (RTD 등)","g":"전자 쪽","d":"문턱을 넘으면 스스로 펄스를 내고 잠시 쉰다. 뉴런의 발화와 불응기를 소자 하나로 흉내 내는 자리."},"eana":{"n":"아날로그 전자 회로 (문턱·분류)","g":"전자 쪽","d":"디지털로 바꾸지 않고 전압 그대로 비교하고 판정한다. 「변환 앞에서 끝낸다」는 구조들이 실제로 답을 내는 자리."}},"BOM":{"MZI 메시":[{"id":"src-cw","r":"입력을 실을 반송 빛. 선폭이 좁아야 여러 단을 지나도 간섭이 유지된다","k":1,"n":"1개"},{"id":"eom","r":"입력 벡터 성분 하나를 세기로 실어 넣는다","k":1,"n":"입력 N개"},{"id":"bs","r":"두 팔로 갈랐다 다시 합친다. MZI 하나의 앞뒤를 이것 둘이 맡는다","k":1,"n":"MZI당 2개","p":[28,50],"lab":"결합기","p2":[64,50]},{"id":"ps","r":"가중치 하나가 곧 이 손잡이다 — θ가 나눔비, φ가 상대 위상","k":1,"n":"N²개","w":"SOI면 열광학·캐리어, TFLN·BTO면 포켈스. 속도와 정적전력이 여기서 갈린다","p":[41,25],"lab":"위상 천이기"},{"id":"lock","r":"히터끼리 열이 새어 서로를 민다 — 보정 루프가 없으면 교정이 금방 흐트러진다","k":0},{"id":"voa","r":"유니터리만으로는 안 되는 임의 행렬의 대각 성분. SVD의 가운데 칸","k":0,"n":"N개"},{"id":"pd","r":"출력 성분을 전류로 읽는다. 세기만 읽으니 여기서 부호가 사라진다","k":1,"n":"출력 N개"},{"id":"tia","r":"광전류를 읽을 전압으로. 이 잡음이 실제 비트 수를 깎는다","k":1},{"id":"adc","r":"아날로그 결과를 숫자로. 시스템 에너지의 큰 몫이 여기","k":1},{"id":"wg","r":"플랫폼이 여기서 정해지고, 그 선택이 위상 천이기의 종류를 가둔다","k":1,"p":[52,73],"lab":"도파관"}],"마이크로링 가중치 뱅크":[{"id":"src-comb","r":"파장 하나가 입력 성분 하나. 콤의 이빨 수가 곧 병렬도다","k":1,"n":"1개(이빨 N개)"},{"id":"eom","r":"파장마다 입력 값을 세기로 싣는다","k":1,"n":"N개"},{"id":"wdm","r":"섞여 온 파장을 링 열로 갈라 넣고 다시 합친다","k":0},{"id":"ring","r":"공진에서 벗어난 정도가 투과율이고, 그 값이 가중치 하나다","k":1,"n":"N×M개","p":[18,59],"lab":"링"},{"id":"ps","r":"링을 데워 공진 파장을 민다 — 가중치를 쓰는 손잡이","k":1,"n":"링마다 1개","p":[18,43],"lab":"히터"},{"id":"lock","r":"칩 온도가 1도 변하면 모든 링의 공진이 같이 밀린다 — 없으면 가중치가 유지되지 않는다","k":1,"n":"1벌"},{"id":"pd","r":"여러 파장을 한 검출기에 때리면 광전류가 그냥 더해진다 — 덧셈이 공짜","k":1,"n":"출력 M개","p":[80,74],"lab":"검출기"},{"id":"tia","r":"합쳐진 광전류를 읽는다","k":1},{"id":"adc","r":"결과를 숫자로","k":1}],"회절 신경망 D²NN":[{"id":"src-cw","r":"입력면을 고르게 비추는 평면파. 코히런트라야 층 사이 간섭이 맞는다","k":1,"n":"1개","p":[4,50],"lab":"조명"},{"id":"slm","r":"입력 이미지를 빛에 올린다. 장면을 직접 받으면 없 ,"n":"1개"},{"id":"delay","r":"직전 슬롯의 결과를 붙잡아 다음 슬롯과 더한다 = 누적","k":1,"n":"1개"},{"id":"amp","r":"루프를 돌수록 깎이는 손실을 되살린다. 없으면 N이 손실에 막힌다","k":0},{"id":"pd","r":"슬롯마다 한 번씩 읽는다","k":1,"n":"1개"},{"id":"tia","r":"광전류를 전압으로","k":1},{"id":"adc","r":"N 사이클을 다 돌아야 결과 한 벌이 나온다","k":1}],"SLM 자유공간":[{"id":"src-cw","r":"판 전체를 고르게 비춘다","k":1,"n":"1개"},{"id":"slm","r":"화소 수만큼 병렬 — 큰 행렬을 한 장에 올린다. 대신 갱신이 밀리초","k":1,"n":"1장"},{"id":"lens","r":"행렬 판과 입력 벡터가 겹쳐 맺히게 한다","k":1,"n":"1~2장"},{"id":"cam","r":"출력 한 장을 통째로 읽는다. 프레임레이트가 처리량을 정한다","k":1,"n":"1개"}],"리저버 컴퓨팅":[{"id":"src-cw","r":"저수지에 흘릴 반송파 한 줄기. 세기와 위상이 상태를 실어 나른다","k":1,"n":"1개"},{"id":"eom","r":"입력 u(t)를 빛에 싣는다. 저수지로 들어가는 유일한 구동이다","k":1,"n":"1개"},{"id":"ysplit","r":"들어온 빛을 노드 수만큼 뿌린다. 분배 비가 곧 입력 가중치다","k":1,"n":"1→N 한 벌"},{"id":"bs","r":"노드끼리 섞는 2×2 결합. 이 고정된 섞임이 학습 안 하는 내부 가중치다","k":1,"n":"노드당 1~2개","p":[17,33.3],"lab":"결합 노드"},{"id":"delay","r":"노드 사이 도파로 길이가 곧 기억이다. 과거 입력이 여기 머문다","k":1,"n":"결합마다 1구간","p":[17,63.9],"lab":"노드 간 지연"},{"id":"amp","r":"포화하는 이득으로 tanh 꼴 비선형을 만든다. 수동 설계면 빼도 된다","k":0,"n":"노드당 1개"},{"id":"pd","r":"노드마다 상태를 읽는다. 수동 저수지에선 이 제곱검출이 유일한 비선형이다","k":1,"n":"노드마다 1개 = N개"},{"id":"tia","r":"검출 전류를 읽기층이 쓸 전압으로 바꾼다","k":1,"n":"N개"},{"id":"adc","r":"노드 상태를 숫자로 내린다 — 읽기층이 전자 쪽에 남는 바로 그 지점","k":1,"n":"N개"},{"id":"fpga","r":"읽기층 가중치를 곱해 더하고 최소제곱으로 학습까지 돌린다","k":1,"n":"1개","w":"학습이 전부 여기서 일어난다 — 칩은 추론도 아니고 특징 생성만 한다","p":[53.4,31.9],"lab":"읽기층 학습"},{"id":"eana","r":"디지털로 안 내리고 아날로그로 바로 가중합을 만드는 갈래","k":0,"n":"1개"}],"스파이킹 광 뉴런":[{"id":"src-cw","r":"뉴런을 역치 바로 아래에 걸어두는 바이어스 광","k":0,"n":"1개","w":"망 안에서는 상류 뉴런의 스파이크가 입력을 대신한다"},{"id":"voa","r":"들어오는 스파이크 세기를 깎아 시냅스 가중치 노릇을 한다","k":0,"n":"입력마다 1개"},{"id":"pd","r":"입력 광을 전류로 바꿔 흥분성 소자에 밀어 넣는다. 적분의 입구다","k":1,"n":"1개","p":[79.5,15.9],"lab":"입력 검출"},{"id":"rtd","r":"문턱을 넘으면 스스로 펄스를 내고 잠시 쉰다. 적분·발화·불응이 전부 여기서 난다","k":1,"n":"뉴런마다 1개","p":[34.1,55.9],"lab":"RTD 막전위"},{"id":"bias","r":"동작점을 음성미분저항 구간 어디에 둘지 정한다 — 이게 곧 역치다","k":1,"n":"뉴런마다 1개","p":[13.6,39.4],"lab":"역치 바이어스"},{" 에도 전력을 계속 먹는다 — PCM 크로스바가 겨냥하는 자리가 바로 이 빈칸이다."],"마이크로링 가중치 뱅크":["온도로부터 독립된 기준이 없다. 가중치가 공진 파장이라는 물리량에 묶여 있어서, 안정화 루프를 빼는 순간 계산이 아니라 온도계가 된다."],"회절 신경망 D²NN":["쓰기가 없다. 가중치가 새겨진 판이라 학습한 뒤 바꾸려면 다시 찍어야 하고, 그래서 추론 전용이다."],"4f 상관기":["학습이 없다. 필터가 고정판이고 찾을 패턴이 거기 새겨져 있어서, 패턴이 바뀌면 판을 바꿔 끼워야 한다."],"호모다인 MVM":["간단한 읽기가 없다. 부호를 되살리는 대가로 기준 빛·위상 안정화·검출기 쌍이 통째로 따라붙는다 — 음수 하나 때문에 시스템이 두 배가 된다."],"시간다중 MVM":["공간 병렬이 없다. 소자를 아끼려고 시간으로 폈기 때문에 결과 한 벌에 N 사이클이 들고, 그 지연은 소자를 더 넣기 전엔 줄지 않는다."],"SLM 자유공간":["빠른 쓰기가 없다. 화소 수만큼 병렬인데 한 장 갱신이 밀리초라, 가중치가 자주 바뀌는 학습에는 못 쓴다."],"리저버 컴퓨팅":["광 쪽에서 오차를 거꾸로 흘려보낼 수단이 없다 — 그래서 저수지 안쪽 가중치를 고칠 방법 자체가 없고, 학습이 읽기층 한 층으로 밀려난다.","노드마다 값을 들고 있을 비휘발 소자가 없다 — 그래서 내부를 학습한다 해도 그 값을 유지하려면 위상 천이기 N²개에 계속 전기를 먹여야 한다.","읽기층을 광에서 끝낼 길이 없다 — 그래서 노드마다 검출기·TIA·ADC가 붙고, 「광으로 연산을 공짜로 했다」는 이득을 출구에서 도로 토해낸다."],"스파이킹 광 뉴런":["스파이크 열을 받아 가중치를 곱해 주는 광 시냅스가 없다 — 그래서 뉴런 하나는 쏘는데 뉴런을 엮어 망을 만드는 데서 막힌다.","흥분성을 만드는 게 결국 전자 소자(RTD)다 — 그래서 뉴런마다 광→전→광을 한 번씩 거치고, 스파이킹이 노리던 저전력 이점이 그 변환에서 깎인다.","스파이킹용 학습 규칙을 칩에서 돌릴 회로가 없다 — 그래서 가중치는 밖에서 구해 넣어야 하고 온칩 학습은 아직 그림이다."],"포토닉 텐서코어":["PCM 셀을 빠르게 다시 쓸 방법이 없다 — 그래서 가중치가 매 스텝 바뀌는 학습 워크로드에는 들어갈 자리가 없고 추론 전용이 된다.","검출기 뒤에 ADC 말고 다른 출구가 없다 — 그래서 파장을 늘려 처리량을 키워도 효율(TOPS/W)은 꿈쩍 않는다. 변환 한 번에 곱셈을 몇 번 했느냐(=M)만 효율을 정한다.","음수를 그대로 담을 셀이 없다 — 투과율은 0 이상이라, 음수 가중치를 쓰려면 셀을 두 개씩 차동으로 묶어 면적을 두 배로 쓴다."],"전광 RNN":["고리 안에서 가중치를 바꿀 수단이 없다 — 그래서 매 바퀴 똑같은 변환만 되풀이한다. 깊은 망이 아니라 고정 가중치 순환층 하나다.","O-E-O 없이 펄스를 되살릴 방법이 없다 — 그래서 바퀴를 돌수록 손실과 잡음이 쌓이고, 전자로 내려 재생하는 순간 전광이 아니게 된다. 깊이가 여기서 막힌다.","칩 위에 쓸 만한 χ²가 아직 없다 — 그래서 비선형이 벌크 결정에 남아 있고, 고리를 여러 개 집적해 층을 쌓는 길이 막혀 있다."],"공간광 이징 머신":["<b>쌍마다 거는 손잡이가 없다<\/b> 손잡이가 스핀마다 하나(N개)인데 임의의 J는 쌍마다 하나(N²개)가 필요하다. 화소는 스핀을 가리킬 뿐 쌍을 못 가리키고, 그 N² 손잡이를 놓을 소자가 이 구성에 없다. 그래서 결합이 몇 개 패턴의 합(Mattis·낮은 랭크)으로 묶인다. 마스크를 여러 장 시간으로 겹쳐 랭크를 올릴 수는 있지만 그만큼 프레임 수가 늘어 느려진다 — 공간에서 못 얻은 자유도를 시간으로 사는 셈이다."],"이징 샘플러":["<b>잡음을 절대값으로 재는 기준이 없다<\/b> voa는 광 세기를 깎을 뿐 온도를 직접 정하지 않는다. 세기에서 유효 온도 β로 가는 환산에 검출기 응답도·TIA 이득·대역·암전류가 전부 섞여 들어가는데, 그 잡음 바닥을 절대값으로 재서 되먹이는 기준 소자가 부품표에 없다. 그래서 β는 뽑은 분포를 거꾸로 맞춰 교정하는 수밖에 없다 — 「잡음 세기를 얼마로 두면 온도가 얼마」라고 미리 말할 수 없는 이유가 이것이다. 페이지의 β=1/σ도 무차원 모형값이고 소자 교정은 미확인이다."],"코히런트 이징 머신":["<b>저장 소자가 한 칸도 없다<\/b> 스핀은 날아가는 빛이고 J는 FPGA 램에 있다. 부품표에 pcm·nvm이 하나도 없는 게 그 뜻이다. 어디에도 상태가 머물지 않으니 매 바퀴 전부 다시 재고 다시 써야 하고, 측정-되먹임 지연이 깎아도 사라지지 않는 벽인 근본 이유가 여기다. 전원을 끄면 문제도 해도 같이 없어진다.","<b>광으로 J를 거는 소자가 없다<\/b> J를 전부 광으로 걸려면 펄스 쌍마다 결합 경로가 하나씩, 곧 N²개가 있어야 한다. delay 한 줄로는 몇 개의 고정 결합밖에 못 만들고, N²개의 지연선을 놓을 방법이 없다. 그래서 fpga로 우회했고 — 그 순간 「거의 자유로운 J」라는 장점을 얻는 대신 기계 속도가 전자에 묶였다. CIM이 전광이 아니라 하이브리드인 건 설계 취향이 아니라 이 부재의 결과다."],"S-SEED":["이득도 캐스케이드도 있었다 — bias 가 이득을 대고 lens 가 단을 잇는다. 없던 건 복원과 밀도다. 대비가 2~3:1 뿐이라 레벨이 한 번 깎이면 되돌릴 문턱 소자가 없고, 팬아웃을 읽기 빔 가르기로 만드는 탓에 게이트 수에 비례해 광원 전력이 커졌다."],"전광 논리 게이트":["복원 소자가 없다. SOA 가 이득은 주지만 「0」 레벨을 도로 끌어내리는 소자가 없어 단마다 소광비가 깎인다 — 전자 인버터가 공짜로 하던 일이다."],"펨토패럿 O-E-O":["여기만 빠진 게 없다. pd 와 eom 이 이득·팬아웃·파장변환을 다 메운다. 대신 TIA 를 일부러 안 쓰는 것이 설계의 핵심이라, 전자 노드를 들인 대가는 따로 치른다."],"폴라리톤 논리":["팬아웃 경로가 없다. 캐비티 한 자리의 응집을 다른 자리 여럿으로 넘기는 소자가 부품표에 아직 없다 — 소자 하나를 보인 것이지 회로가 아니다."],"2D 소재 비선형":["손실을 되돌릴 소자가 없다. 비선형을 키우면 흡수가 같이 커지는데, amp 를 매 단에 꽂으면 2D 를 쓴 이유가 사라진다."],"자기 스위칭":["증폭기가 없다. 출력이 입력 자신이라 amp 를 꽂을 자리가 없고, 한 번 스위칭하고 나면 다음 단을 때릴 여력이 남지 않는다."],"In-sensor computing":["광원이 없다 — 바깥 장면의 빛이 그대로 첫 층이다. 그리고 화소마다 도는 ADC가 없다. 보통 센서는 화소를 전부 읽어 변환하지만 여기선 전하가 모이며 합산이 끝나 변환이 출력 노드 수만큼으로 준다."],"회절 인코더":["광원도 없고 ADC도 없다. 장면의 빛이 입력이고, 회절이 뽑은 특징을 아날로그 전자가 전압 그대로 받아 판정한다. 둘 사이에 디지털을 끼우는 순간 이 구조의 이유가 사라진다."],"메타표면 연산":["광원도 증폭기도 메모리도 없다. 수동 소자라 |H| ≤ 1이고, 통과할 때마다 신호가 줄기만 해서 층을 쌓을 수가 없다 — 1차 두 장이 2차 한 장과 수치가 같아질 뿐이다. 그래서 자리가 센서 앞 한 장이다."],"광 전처리기":["칩 위에 광원이 없다. 다만 앞의 셋과 이유가 다른데, 장면이 아니라 통신 신호가 입력이라 광원이 멀리 송신단에 있고 빛이 섬유를 타고 들어온다. 그리고 가중치가 없다 — 연산을 하는 게 아니라 변환 앞에서 신호를 다듬을 뿐이다."],"보손샘플링":["이득이 없다 — 그리고 꽂을 수도 없다. 광자는 복제가 안 되니(no-cloning) amp 를 끼우면 양자상태가 깨져 간섭이 사라진다. 손실이 η^(mn) 으로 지수로 깎이는데 되돌릴 소자가 원리적으로 존재하지 않는 것이 이 구조의 벽이고, 그래서 저손실 재료(SiN)로 가는 수밖에 없다. 또 결정론적 단일광자원이 없다 — qsrc 로 적었지만 SPDC·SFWM 은 확률적이라 「광자가 왔는지」를 헤럴딩으로 알 뿐이고, n 개를 동시에 얻을 확률이 n 에 지수로 떨어진다. 부품표의 두 지수(손실과 동시발생)가 곱해지는 자리다."],"마이크로파 포토닉스":["되먹임이 없다. 탭 지연선은 FIR 이라 DC 에서 응답이 평탄하고, 그래서 참 적분이 안 된다 — ring 을 선택으로 둔 자리가 그 구멍이다. 그리고 계수를 들고 있을 비휘발 소자가 없다. voa 는 전원을 끄면 값이 날아가서 계수를 계속 걸어둬야 하는데, 어휘의 pcm·nvm 을 쓰면 꺼도 남지만 쓰기가 느려 실시간 재구성이라는 이 구조의 장점을 깎는다. 이득도 없다 — 탭을 늘리면 분배 손실이 1/N 로 나뉘고 지연선 손실이 쌓이는데, amp 를 꽂으면 ASE 잡음이 아날로그 정밀도를 도로 깎는다."],"주파수 콤":["콤을 세우는 부품은 다 있다. 빠진 것은 평탄화다 — 빗살 세기가 sech² 로 떨어지는데 그걸 고르게 펴는 소자(이득 평탄화 필터)가 어휘에 없다. 그래서 「빗살 N 개 = 채널 N 개」가 부품표에서는 성립하는데 실제로는 가장자리 선을 못 써서 깎인다 — 「수천 채널」을 미확인으로 두는 이유가 이것이다. 빗살마다 세기를 맞추려면 voa 배열이 필요하지만 그건 이 구조가 아니라 가중치 뱅크(A군) 쪽 부품이다."],"4×4 메시 실물":["온칩 광원이 없다. 실리콘은 간접천이라 빛을 스스로 못 내서 레이저가 늘 칩 밖에 있고, 그래서 섬유와 칩을 잇는 결합이 시스템의 첫 손실이 된다 — 이 한 가지가 패키징 비용과 조립 난이도의 대부분을 만든다."]}}</script>
