emiconductor. In all-optical logic, what is used for switching is not the amplification itself but <b>the nonlinearity of gain saturation<\/b>.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"전광 논리 게이트","x":"","w":false,"sid":"d2","c":"입자"},{"t":"이득포화","d":"Gain being compressed as the input grows stronger. Solved in the form G = G₀·exp(−(G−1)P/P_sat), it is used for strong light to switch off the gain of weak light.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"전광 논리 게이트","x":"","w":false,"sid":"d2","c":"관계"},{"t":"XGM (교차이득변조)","d":"Data light compressing a medium's gain to switch light at another wavelength. The output is the inverse of the input, so it is an inverter as is.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"전광 논리 게이트","x":"","w":false,"sid":"d2","c":"관계"},{"t":"XPM · FWM","d":"In cross-phase modulation one beam pushes another beam's <b>phase<\/b>; in four-wave mixing two beams mix to create <b>new wavelengths<\/b>. Unlike XGM, which uses intensity only, interferometers or filters come along.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"전광 논리 게이트","x":"","w":false,"sid":"d2","c":"관계"},{"t":"O-E-O (광–전–광 변환)","d":"Receiving light electrically and sending it out as light again. It gives up all-optical purity but gets <b>gain, cascading and wavelength conversion<\/b> at once.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"펨토패럿 O-E-O","x":"","w":false,"sid":"d3","c":"관계"},{"t":"스위칭 에너지","d":"The energy needed to change state once. In structures that charge an electrical node it is <b>½CV²<\/b>, so reducing capacitance is the same as reducing energy.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"펨토패럿 O-E-O","x":"","w":false,"sid":"d3","c":"관계"},{"t":"RC 시정수","d":"The response time set by resistance and capacitance, τ = RC. Multiply kΩ by fF and you get ps directly; the bandwidth is 1/2πRC.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"펨토패럿 O-E-O","x":"","w":false,"sid":"d3","c":"관계"},{"t":"펨토패럿 (fF)","d":"10⁻¹⁵ F. Fuse the photodetector and modulator <b>with no wiring<\/b> to remove parasitic capacitance and you get down to this level — NTT reported the 2 fF class in 2019 (Nozaki et al.).","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"펨토패럿 O-E-O","x":"","w":false,"sid":"d3","c":"관계"},{"t":"폴라리톤","d":"A quasiparticle formed by mixing light with a material excitation (exciton). Dressed with a material component, <b>photons start to feel each other<\/b>, strengthening the nonlinearity.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"폴라리톤 논리","x":"","w":false,"sid":"d4","c":"입자"},{"t":"강결합","d":"A state where light and matter exchange energy faster than each leaks away on its own. Polaritons form only past this line.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"폴라리톤 논리","x":"","w":false,"sid":"d4","c":"관계"},{"t":"χ⁽³⁾ (3차 비선형 감수율)","d":"The material constant that sets how much the refractive index changes in proportion to intensity. The Kerr effect's n₂ comes from here.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"2D 소재 비선형","x":"","w":false,"sid":"d5","c":"관계"},{"t":"FOM (비선형 품질지수)","d":"n₂ divided by loss. Boosting only a material's nonlinearity raises absorption too, so <b>the loss per π phase stops at some value<\/b> — what actually has to move is this ratio.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"2D 소재 비선형","x":"","w":false,"sid":"d5","c":"관계"},{"t":"쌍안정","d":"A state where two stable outputs coexist for the same input. The switching points differ when going up and coming down, creating a <b>hysteresis<\/b> loop.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"자기 스위칭","x":"","w":false,"sid":"d6","c":"관계"},{"t":"히스테리시스","d":"The path going up differing from the path coming down. The width of that loop is the device's margin for holding a state.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"자기 스위칭","x":"","w":false,"sid":"d6","c":"관계"},{"t":"임계 세기","d":"The input intensity at which nonlinear switching starts. In a resonator it is proportional to the mode volume and <b>inversely proportional to Q squared<\/b>.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"자기 스위칭","x":"","w":false,"sid":"d6","c":"관계"},{"t":"Q값","d":"How long a resonator traps light. If the same light comes back thousands of times the effective nonlinearity grows by that much, so doubling Q cuts the threshold to 1/4.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"자기 스위칭","x":"","w":false,"sid":"d6","c":"관계"},{"t":"모드 부피","d":"The size of the space where light is actually confined. For the same number of photons, a smaller volume means higher intensity and stronger nonlinearity.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"자기 스위칭","x":"","w":false,"sid":"d6","c":"관계"},{"t":"PhC 나노캐비티 (광결정)","d":"A resonator that deliberately puts a defect in a periodic structure to trap light in a wavelength-scale space. A structure aiming at <b>high Q and small mode volume<\/b> at once, and where many of family D's paths finally meet.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"자기 스위칭","x":"","w":false,"sid":"d6","c":"입자"},{"t":"in-sensor computing","d":"Finishing multiplication <b>at the very point<\/b> where light becomes current. Tune a pixel's responsivity with voltage and that is the weight, so multiply-accumulate is already done as charge collects.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"In-sensor computing","x":"","w":false,"sid":"e1","c":"미분류"},{"t":"감응도","d":"How much current a pixel produces per unit of light received. Usually a fixed property of the device, but making it tunable by voltage turns it into <b>a place to store weights<\/b>, and gathering several pixels' photocurrents on one line finishes addition without circuits.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"In-sensor computing","x":"","w":false,"sid":"e1","c":"관계"},{"t":"회절 인코더","d":"A front end that extracts features from the input just by passing it through diffractive plates. Almost no power or latency, but <b>once fabricated the kernel is frozen<\/b>.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"회절 인코더","x":"","w":false,"sid":"e2","c":"입자"},{"t":"ACCEL","d":"A diffractive front end + analog electronic back end structure published by Tsinghua (Nature 623, 2023). With no digital in between, it skips the ADC. The reported 74.8 peta-OPS/W has ⚠️ <b>an unconfirmed definition of precision bits<\/b>, so it must not be compared directly with other chips.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"회절 인코더","x":"","w":false,"sid":"e2","c":"입자"},{"t":"아날로그 전자 분류기","d":"A back end that takes the features extracted by light as analog voltage or current states and decides, without moving them to digital. Make the back end digital and the ADC comes back, erasing the front end's advantage.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"회절 인코더","x":"","w":false,"sid":"e2","c":"입자"},{"t":"압축률","d":"By what fraction the front end reduced the data. Gathering 128 input points into 8 detectors is 16×, and the back end has that much less to take in and process. But <b>the more it is reduced, the smaller the decision margin becomes too<\/b>.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"회절 인코더","x":"","w":false,"sid":"e2","c":"관계"},{"t":"각 스펙트럼","d":"The decomposition of a light distribution into spatial-frequency components. Whether propagation or differentiation, most free-space optical computations are written as <b>multiplying a transfer function in this domain<\/b>.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"회절 인코더","x":"","w":false,"sid":"e2","c":"관계"},{"t":"전달함수","d":"The value H(k) an optical system multiplies each spatial-frequency component of the input by. Metasurface design is, in the end, implementing the H(k) corresponding to the desired computation as a structure.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"메타표면 연산","x":"","w":false,"sid":"e3","c":"관계"},{"t":"공간 미분 필터","d":"Multiplying by i·k in the frequency domain is spatial differentiation. When one metasurface implements that transfer function, <b>edges are extracted just by passing through<\/b>.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"메타표면 연산","x":"","w":false,"sid":"e3","c":"관계"},{"t":"커널 고정","d":"The constraint that weights engraved in a mask or metasurface cannot be changed once fabricated. So such devices stand at inference front-end preprocessing and <b>cannot stand where weights must change<\/b>.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"메타표면 연산","x":"","w":false,"sid":"e3","c":"관계"},{"t":"수동 소자","d":"A device that adds no energy. It means the magnitude of the transfer function cannot exceed |H| ≤ 1, and the signal only shrinks with each pass — this is what <b>no gain<\/b> means.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"메타표면 연산","x":"","w":false,"sid":"e3","c":"관계"},{"t":"광 전처리","d":"Not replacing computation but <b>conditioning the signal before conversion<\/b>. Shaking out out-of-band noise optically first shrinks the range the ADC must cover and the bits it needs — the most boring-looking yet most direct gain in family E.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"광 전처리기","x":"","w":false,"sid":"e4","c":"미분류"},{"t":"저역통과 필터","d":"A filter that passes only low frequencies and trims the high ones. Noise is spread over a wide band and the signal concentrated in a narrow one, so it helps, but <b>narrowing it too much trims the signal too<\/b> and SNR drops instead.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"광 전처리기","x":"","w":false,"sid":"e4","c":"입자"},{"t":"SNR","d":"The ratio of signal to noise power, usually written in dB. Shaking out noise first with an optical filter raises it, and by that much the precision required of the back-end ADC can be lowered.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"광 전처리기","x":"","w":false,"sid":"e4","c":"관계"},{"t":"유효 비트 수","d":"The number of bits an ADC actually resolves usefully (ENOB), converted from SNR at <b>1 bit per 6.02 dB<\/b>. Each bit removed doubles quantization noise, so to cut bits other noise must be cleared first.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"광 전처리기","x":"","w":false,"sid":"e4","c":"관계"},{"t":"electro-optical 하이브리드","d":"An approach that keeps <b>as a design variable<\/b> how far light goes and where electronics take over. All of family E belongs here, and this is where it parts ways with the all-optical line of “doing everything in light”.","l":"G:E","dn":0,"up":0,"gs":["E"],"s":"In-sensor computing","x":"","w":false,"sid":"e1","c":"미분류"},{"t":"선형광학 양자컴 (LOQC)","d":"Quantum computation with only beam splitters and phase shifters. The key is that <b>the circuit is the same as a computing optical accelerator<\/b> — stream light with intensity through the same MZI mesh and it is matrix multiplication; feed in single photons and it is a quantum computer. Only the light fed in changes.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"보손샘플링","x":"","w":false,"sid":"f1","c":"미분류"},{"t":"HOM 간섭","d":"Put two indistinguishable photons into both sides of a 50:50 beam splitter and <b>they bunch and leave through the same output<\/b>, dropping coincidences to 0. The coincidence probability is (T²+R²) − 2TR·V, and with full overlap at 50:50 it is (T−R)² = 0.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"보손샘플링","x":"","w":false,"sid":"f1","c":"관계"},{"t":"구별 불가능성","d":"How alike two photons' arrival times, polarizations and shapes are. If identical, the overlap V=1 and the HOM dip goes all the way to 0; if mismatched, it <b>returns to the classical value of 0.5<\/b> — where quantum interference disappears.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"보손샘플링","x":"","w":false,"sid":"f1","c":"관계"},{"t":"퍼머넌트","d":"A quantity with the same formula as the determinant but with all signs +. Boson sampling output probabilities are set by it, and <b>its being hard to compute (proportional to n!) is the premise of the experiment<\/b>. For small cases like 4 modes · 3 photons it can be expanded directly even in a browser.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"보손샘플링","x":"","w":false,"sid":"f1","c":"관계"},{"t":"단일광자 검출기 (SNSPD)","d":"A device that counts single photons with superconducting nanowires. A pulse-tube cryocooler reaching 2–4 K comes along, so increasing photon counts <b>means adding cryocoolers too<\/b>. (The statement that it is at a small-volume commercial stage is unconfirmed.)","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"보손샘플링","x":"","w":false,"sid":"f1","c":"입자"},{"t":"투과율 η","d":"The probability a photon survives passing one component. This value is why loss requirements on the quantum side go down to the dB/m range, and <b>however good, η is below 1 and stacks exponentially with the number of components<\/b>.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"보손샘플링","x":"","w":false,"sid":"f1","c":"관계"},{"t":"지수 붕괴 η^(mn)","d":"One photon passing m components survives with η^m, and all n must survive, so η^(mn). <b>The exponent is m·n, so it collapses the moment you add photons<\/b> — with η=0.99 and m=40, survival at 20 photons is 0.032%, about once in 3,100. (Computed directly.)","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"보손샘플링","x":"","w":false,"sid":"f1","c":"관계"},{"t":"탭 지연선","d":"A structure that splits light into several branches, gives them different delays, multiplies by coefficients and sums them again. The body of a microwave photonic processor, and <b>swapping only the coefficients turns the same hardware into a differentiator, integrator or filter<\/b>. A 2024 <i>Nature<\/i> processing engine reported 98.1% accuracy for integration and differentiation (reported value, reproduction unconfirmed).","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"마이크로파 포토닉스","x":"","w":false,"sid":"f2","c":"입자"},{"t":"FIR 필터","d":"A filter built from a finite number of taps with no feedback. The response comes out as H(f) = Σ cₖ·e^(−j2πf·kΔT), and <b>the absence of feedback is what limits optical integrators<\/b>.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"마이크로파 포토닉스","x":"","w":false,"sid":"f2","c":"입자"},{"t":"자유 스펙트럼 범위 (FSR)","d":"The period at which the response repeats. In a tapped delay line it is the inverse of the tap spacing (1/ΔT), and half of that is the usable ceiling (Nyquist), so <b>a frequency specified above it folds back down<\/b>. For a frequency comb it means the spacing between comb lines.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"마이크로파 포토닉스","x":"","w":false,"sid":"f2","c":"관계"},{"t":"광 미분기","d":"Taking the time derivative of a signal with light. Ideally |H| ∝ f, and more taps widen the band that follows that line — <b>38% of Nyquist with 2 taps, 96% with 16<\/b>. But the delay lines get longer and loss accumulates. (Computed directly.)","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"마이크로파 포토닉스","x":"","w":false,"sid":"f2","c":"입자"},{"t":"광 적분기","d":"Time integration with light. A caveat — a tapped delay line with all coefficients 1 has a flat |H|=1 at DC, so it is <b>a finite average, not true integration<\/b> (a true integrator must diverge at DC). So real optical integrators are made with high-Q rings that have feedback.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"마이크로파 포토닉스","x":"","w":false,"sid":"f2","c":"입자"},{"t":"주파수 빗 (광 콤)","d":"A spectrum of hundreds to thousands of evenly spaced lines extracted from one laser. In wavelength-multiplexed computing <b>one comb line is one channel<\/b>, so the comb is the parallelism, the side that supplies wavelengths to the ring weight bank.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"주파수 콤","x":"","w":false,"sid":"f3","c":"입자"},{"t":"빗살 간격 (반복률)","d":"The frequency spacing between comb lines. It is the inverse of the resonator round-trip time, so <b>the resonator size sets the spacing<\/b>. Number of lines × spacing is the total width, and edge lines are weak, so not every drawn line is a usable channel.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"주파수 콤","x":"","w":false,"sid":"f3","c":"관계"},{"t":"위상잡음 20·log N","d":"Divide an optical reference frequency by N to make microwaves and the phase jitter shrinks N times; on the dB scale it drops by 20·log₁₀N. <b>Bringing 200 THz down to 10 GHz gives N=20,000, about 86.0 dB<\/b>. This is the ceiling of division; the detector shot/thermal noise floor is not included. (Computed directly.)","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"주파수 콤","x":"","w":false,"sid":"f3","c":"관계"},{"t":"고Q 공진기","d":"A resonator where light is trapped for millions of round trips. Because it concentrates intensity it is <b>an essential condition for building a comb<\/b>, and the higher the Q, the lower the threshold power to turn the comb on.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"주파수 콤","x":"","w":false,"sid":"f3","c":"입자"},{"t":"커 비선형","d":"The property of refractive index changing with intensity. It spreads one laser line into many evenly spaced lines to make a soliton comb — <b>a comb forms only with both a high-Q resonator and Kerr nonlinearity<\/b>.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"주파수 콤","x":"","w":false,"sid":"f3","c":"관계"},{"t":"2광자 흡수 (TPA)","d":"Absorption that consumes two photons at once to excite an electron. Silicon has it at 1550 nm, so <b>absorption grows as intensity rises and the soliton does not form<\/b>. This is why silicon cannot be used to make combs on chip.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"주파수 콤","x":"","w":false,"sid":"f3","c":"관계"},{"t":"질화실리콘 (SiN)","d":"A material with a wide bandgap, so no two-photon absorption at 1550 nm, and low loss too. <b>The quantum side's low-loss requirement and the comb side's TPA avoidance both end in this material<\/b> — where solving different problems arrives at the same material.","l":"G:F","dn":0,"up":0,"gs":["F"],"s":"주파수 콤","x":"","w":false,"sid":"f3","c":"입자"},{"t":"Vπ·L","d":"The product of the voltage and length needed to shift the phase by π. The smaller, the shorter and lower-voltage the modulation — bulk LN is in the 10 V·cm range, thin film in the 1–3 V·cm range.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"관계"},{"t":"삽입손실","d":"The amount of light lost just by inserting a device. It accumulates as circuits get longer and becomes the wall that sets the depth of optical computing.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"관계"},{"t":"유효 굴절률","d":"The refractive index light actually feels. Not the core's value alone but <b>a weighted average including the part that leaks out<\/b>, so the waveguide shape and surrounding material set it together.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"관계"},{"t":"에바네센트 장","d":"The tail of light leaking exponentially outside the waveguide. How much of it feels the outside is the sensor's sensitivity, and the same amount is loss.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"관계"},{"t":"BOX","d":"The oxide layer under silicon waveguides (buried oxide). The substrate has the same index as the core, so it must be raised by about 2 µm to keep light from leaking downward.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"입자"},{"t":"클래딩","d":"The low-index layer surrounding the core. The difference from the core is the force confining light, and the larger it is, the thinner the waveguide can be.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"입자"},{"t":"히터 위상천이기","d":"A metal strip on top of the waveguide that heats it to change the refractive index. Lossless and easy to make, but <b>slow, and it draws power the whole time it is on<\/b>.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"입자"},{"t":"본딩 패드","d":"A metal square on the chip. External wires attach here, and pads and wiring take up a large share of chip area.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"입자"},{"t":"와이어 본딩","d":"The assembly process connecting pads to the package with fine gold wires. The most common way to get electricity out of a chip.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"미분류"},{"t":"파이버 어레이","d":"A part holding several fibers side by side in V-grooves. It is butted against the chip facet to put light in and out, and <b>alignment is at the µm level<\/b>, so assembly is expensive.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"입자"},{"t":"결합손","d":"Light lost between fiber and chip. It arises because the mode sizes differ greatly, and system performance is often eroded here.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"관계"},{"t":"테이프아웃","d":"Handing a design to the fab to be fabricated. Once handed over you wait months, so skill is how much you fit accurately onto one run.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"미분류"},{"t":"DRC","d":"Automatically checking that a design does not violate process rules. It must pass to be fabricated.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"미분류"},{"t":"실측 정밀도","d":"The number of bits optical computing actually guarantees. Thermal drift and fabrication variation shake the phases, so <b>6–9 bits<\/b> is today's level.","l":"G:M","dn":0,"up":0,"gs":["M"],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"관계"},{"t":"주파수 천이기","d":"A device that moves the frequency of light by a fixed amount. <b>The same thing as a phase shifter, used differently<\/b> — keep pushing the phase at a constant rate over time and that is a frequency shift (Δω = dφ/dt), so it can be made by feeding a sawtooth to an electro-optic modulator (serrodyne). The most common real device is the acousto-optic modulator (AOM), where light diffracts off fringes made by ultrasound and is shifted by the sound frequency — usually tens to hundreds of MHz. Three uses — <b>heterodyne detection<\/b>, which shifts the reference to lift the signal to RF (no need to lock the phase, and the 1/f noise floor is avoided) · <b>frequency multiplexing<\/b>, which shifts each channel differently to separate them on one detector · and <b>magnet-free isolators<\/b>, since a round trip does not return to the original.","l":"L3","dn":0,"up":0,"gs":[],"s":"마이크로파 포토닉스","x":"","w":false,"sid":"f2","c":"입자"},{"t":"EO 변조기","d":"A device that controls light with voltage. The Pockels effect changes the refractive index by Δn ∝ r·E, and an MZI turns that phase change into an intensity change. The yardstick is <b>Vπ·L<\/b> — the smaller, the shorter and lower the voltage. Bulk LiNbO₃ is in the 10 V·cm range and thin film (TFLN) in the 1–3 V·cm range, doing the same job much smaller and at lower voltage. It differs from heater phase shifters in two ways — it is <b>fast, at GHz<\/b>, and it <b>draws no power<\/b> while holding a value (closer to charging a capacitor).","l":"L3","dn":0,"up":0,"gs":[],"s":"4×4 메시 실물","x":"","w":false,"sid":"","c":"입자"},{"t":"EO 주파수 변환기","d":"A device that moves light into a neighboring frequency bin with voltage alone. Drive a ring resonator with <b>microwaves matched to the longitudinal-mode spacing (FSR)<\/b> and photons hop one bin at a time — with no sound waves or nonlinear mixing, just electrodes. Harvard's Lončar group showed a <b>28 GHz shift with about 90% on-chip efficiency<\/b> using two coupled thin-film lithium niobate rings (Nature 2021), and chaining it driven by a single 29.8 GHz tone reached 119.2 GHz. It opened, with an integrated device, the GHz range AOMs could not reach.","l":"L3","dn":0,"up":0,"gs":[],"s":"주파수 콤","x":"","w":false,"sid":"f3","c":"입자"},{"t":"주파수 빔 분할기","d":"The same device set to <b>cross over only halfway<\/b> — a beam splitter between two frequency bins. It does on the frequency axis what a directional coupler does by placing two waveguides side by side to mix light in space. It works because the process runs both ways (pushing only one way would not make a splitter), and so it opens a path to <b>building MZI meshes on the frequency axis rather than in space<\/b> — a branch that runs large matrices without laying down N² devices. The same device was shown to swap the information of two frequency channels without blocking (Nature 2021).","l":"L4","dn":0,"up":0,"gs":[],"s":"MZI 메시","x":"","w":false,"sid":"a1","c":"입자"},{"t":"밴드갭","d":"The energy gap between the top of the valence band and the bottom of the conduction band. <b>Not something a material holds, but the distance between two bands<\/b>, so this one value sets from which wavelength the material starts absorbing light. At 300 K, GaAs is 1.424 eV (direct) and AlAs 2.163 eV (indirect X). That Si cannot emit light is due not to the size of the gap but to its being <b>indirect<\/b>. (Source — TU Wien Palankovski dissertation, Tables 3.9 · 3.12)","l":"L2","dn":0,"up":0,"gs":["D"],"s":"","x":"","w":false,"sid":"","c":"관계"},{"t":"엑시톤","d":"When light lifts an electron into the conduction band, a hole is left in the valence band, and the two bound by the Coulomb force orbit like a hydrogen atom. <b>A quasiparticle with zero total charge<\/b>, it only moves around and carries no current. It appears in absorption spectra as a sharp peak just below the bandgap, but in bulk it is easily broken by room-temperature thermal energy. Confined in a quantum well, the peak survives even at room temperature, which is the premise for QCSE.","l":"L1","dn":0,"up":0,"gs":["D"],"s":"S-SEED","x":"","w":false,"sid":"d1","c":"입자","im":"<svg viewBox='0 0 400 392' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto;display:block' role='img' aria-label='엑시톤: 전자와 정공이 묶인 모습과 흡수 스펙트럼의 봉우리'>\n<text x='14' y='20' font-family='Noto Sans KR,sans-serif' font-size='12.5' font-weight='700' fill='#1C1B18'>① 전자와 정공이 쿨롱 힘으로 묶인다<\/text>\n<ellipse cx='200' cy='98' rx='86' ry='50' fill='none' stroke='#6B675E' stroke-width='1.2' stroke-dasharray='4 4'/>\n<line x1='216' y1='98' x2='270' y2='98' stroke='#6B675E' stroke-width='1'/>\n<text x='243' y='88' font-family='IBM Plex Mono,monospace' font-size='9.5' fill='#6B675E' text-anchor='middle'>a_B≈12nm<\/text>\n<circle cx='200' cy='98' r='14' fill='#F7E6DF' stroke='#C9472F' stroke-width='1.6'/>\n<text x='200' y='103' font-family='IBM Plex Mono,monospace' font-size='15' font-weight='600' fill='#C9472F' text-anchor='middle'>+<\/text>\n<circle cx='286' cy='98' r='14' fill='#E1EEF0' stroke  well depth. SEEDs and S-SEEDs came from this material. (Source — Ioffe NSM AlGaAs · TU Wien Palankovski)","l":"L2","dn":0,"up":0,"gs":["D"],"s":"S-SEED","x":"","w":true,"sid":"d1","c":"입자"},{"t":"PIN 다이오드 변조기","d":"A diode with an undoped intrinsic (i) layer between p-type and n-type semiconductors. Several quantum wells are put in that i layer and a <b>reverse voltage<\/b> is applied. Being reverse-biased, almost no current flows, and the voltage falls entirely across the i layer, becoming a field across the wells. That field moves the exciton absorption peak by QCSE, so at a fixed wavelength it becomes <b>a valve that blocks or passes light by voltage<\/b>. Absorbed light comes out as photocurrent, so the same device is also a detector — tying these two faces into one circuit is the SEED.","im":"<svg viewBox='0 0 400 380' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto;display:block' role='img' aria-label='PIN 다이오드 변조기: 구조와 전압에 따른 흡수 변화'>\n<text x='14' y='20' font-family='Noto Sans KR,sans-serif' font-size='12.5' fill='#1C1B18' text-anchor='start' font-weight='700'>① p와 n 사이에 양자우물(i층)을 끼우고 역전압을 건다<\/text>\n<rect x='110' y='60' width='180' height='26' fill='#F7E6DF' stroke='#C9472F'/>\n<text x='200' y='77' font-family='IBM Plex Mono,monospace' font-size='12' fill='#C9472F' text-anchor='middle' font-weight='600'>p<\/text>\n<rect x='110' y='86' width='180' height='54' fill='#FBFAF7' stroke='#6B675E'/>\n<path d='M116,93 L284,93' fill='none' stroke='#B7791F' stroke-width='2'/>\n<path d='M116,101 L284,101' fill='none' stroke='#B7791F' stroke-width='2'/>\n<path d='M116,109 L284,109' fill='none' stroke='#B7791F' stroke-width='2'/>\n<path d='M116,117 L284,117' fill='none' stroke='#B7791F' stroke-width='2'/>\n<path d='M116,125 L284,125' fill='none' stroke='#B7791F' stroke-width='2'/>\n<path d='M116,133 L284,133' fill='none' stroke='#B7791F' stroke-width='2'/>\n<text x='298' y='117' font-family='Noto Sans KR,sans-serif' font-size='10.5' fill='#1C1B18' text-  x='60' y='314' font-family='Noto Sans KR,sans-serif' font-size='10' fill='#C9472F' text-anchor='start'>이 파장에서 덜 먹는다<\/text>\n<text x='14' y='374' font-family='Noto Sans KR,sans-serif' font-size='10' fill='#1C1B18' text-anchor='start'>전압으로 빛을 끄고 켜는 밸브. 먹은 빛은 광전류로 나온다 → 검출기도 된다<\/text>\n<\/svg>","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"S-SEED","x":"","w":false,"sid":"d1","c":"입자"},{"t":"S-SEED","d":"Symmetric SEED (symmetric self-electro-optic effect device). An optical latch connecting two quantum-well PIN diode modulators <b>in series<\/b> across a supply, built by Lentine and Miller at Bell Labs in 1988. Shine the S and R beams on the two diodes separately and the voltage of the one receiving more light drops; as its voltage drops its absorption grows, dropping it further. This feedback freezes the device into one of two states, and the two outputs are always opposite. The decision is made by the <b>ratio<\/b>, not the intensities, of the two beams, so it works even when the light level swings tens of times. The state is written with weak beams and read with a strong read beam, so the output's power comes from the read beam — and that is the gain. Bell Labs' optical switching demonstrators of the 1990s were built from arrays of this device.","im":"<svg viewBox='0 0 400 360' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto;display:block' role='img' aria-label='S-SEED: 양자우물 PIN 다이오드 두 개를 직렬로 이은 광 래치'>\n<text x='14' y='20' font-family='Noto Sans KR,sans-serif' font-size='12.5' fill='#1C1B18' text-anchor='start' font-weight='700'>① PIN 다이오드 변조기 둘을 전원 사이에 직렬로<\/text>\n<path d='M200,44 L200,70' fill='none' stroke='#1C1B18' stroke-width='1.6'/>\n<text x='208' y='50' font-family='IBM Plex Mono,monospace' font-size='11' fill='#1C1B18' text-anchor='start'>+V<\/text>\n<path d='M188,94 L212,94 L200,76 Z' fill='#FBFAF7' stroke='#2C7A86' stroke-width='1.6'/>\n<path d='M188,76 L212,76' fill='none' stroke='#2C7A86' stroke-width='2'/>\n<path d='M200,94 L200,126' fil
