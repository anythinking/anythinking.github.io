<div class="ph"><h1>Glossary</h1><p>346 terms you need to study optical computing, grouped by layer and kind.</p></div>
<script type="application/json" id="data-glossary">[{"t":"실리콘 집적 포토닉스·뉴럴 인터페이스","d":"An axis that uses on-chip photonic circuits for both <b>computing and brain–machine interfaces<\/b>. Silicon photonics that works even in visible light is the core technology.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"포토닉 결정·나노포토닉스","d":"Structures that use periodic arrays of holes to create <b>wavelength bands light cannot pass<\/b>, confining or bending light.","l":"L3","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"집적포토닉스·수신기","d":"Circuits that receive optical signals and turn them into electrical ones, and their integration. The other side of the modulator.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"멤리스티브 포토닉스","d":"An axis that couples devices that remember resistance into photonic circuits to <b>store values like synapses<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"Si 위 양자점 레이저","d":"Growing quantum-dot crystals directly on a silicon substrate to make lasers. One of the <b>head-on solutions to the on-chip source problem<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광 합성곱 가속기","d":"A device that processes a neural network's convolutions in a photonic circuit. Built from tunable couplers and delay lines.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"Si PIC·APD","d":"Technology that puts <b>avalanche photodiodes<\/b> (amplifying and detecting weak light) together into silicon photonic circuits.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"어븀 도프 실리콘 나노포토닉스","d":"An axis that implants erbium into silicon nanostructures to make <b>spin–photon interfaces<\/b>. Closer to the quantum side.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"화합물반도체","d":"III-V semiconductors in general — not silicon.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광 RAM·전광 스위칭","d":"Devices that <b>hold values as light<\/b> without converting light to electrons. This group's record is holding one at 30 nW by miniaturizing the cavity with photonic crystals.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광전융합 디바이스","d":"NTT's IOWN vision of fusing electronic and photonic circuits into a single device. It has reached the stage of bringing light <b>inside the computer<\/b>, beyond the network.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"III-V/Si 변조기·CPO","d":"An axis that builds modulators with III-V on silicon and places them beside the processor (co-packaged optics).","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"SiPh MPW 파운드리","d":"A place that fabricates silicon photonics chips on shared wafers. <b>Access to one is what makes research possible<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"프로그래머블 광 프로세서","d":"A photonic circuit whose interferometer grid is changed electrically so one chip does many functions — the optical version of an FPGA. iPRONICS actually sells this.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광IO·패키징","d":"The process of getting light out of a chip, connecting it to fiber and assembling everything into one part. <b>A large share of PIC manufacturing cost<\/b>, with few academic bases.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"전사인쇄 이종집적","d":"A method of <b>moving thin devices made on another wafer and stamping them on<\/b>. One of the realistic ways to put lasers on silicon.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"PZT·BTO 변조기","d":"An approach that puts ferroelectrics on silicon to get the <b>Pockels effect<\/b>. It borrows, through a material, a property silicon lacks.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"플라즈모닉 EO","d":"Puts light onto electron oscillations at a metal surface, confines it in <b>a space smaller than the wavelength<\/b> and modulates it. Extremely small and fast, at the cost of metal loss.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"도파관 증폭기(EDWA)","d":"A fiber amplifier (EDFA) moved onto an on-chip waveguide. It <b>restores, as light<\/b>, the loss that grows as photonic circuits get longer.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"InP 파운드리·MPW","d":"A service fabricating indium-phosphide chips on shared wafers. Designs that need lasers go through here.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"SiPh 위 CMOS 집적","d":"An approach that adds electronic circuits on top of a silicon photonics process without changing it. A compromise between monolithic and multi-chip.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"TFLN 파운드리","d":"A place that fabricates thin-film lithium niobate chips. A new trade born in the last few years, <b>concentrated in Switzerland<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"UTC-PD 검출기","d":"Uni-Travelling-Carrier photodiode — a detector structure that moves only electrons to get <b>ultrahigh speed and high power<\/b> at once.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"300mm SiPh 공정","d":"A line making silicon photonics on 12-inch wafers. At volume scale, so <b>research results go straight into industry<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"박사 펠로십","d":"A PhD scholarship <b>given directly by the state<\/b>, not the university. A position opens regardless of the supervisor's funding.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"국가 나노팹","d":"A government-run shared semiconductor processing facility. With a public MPW, even students can fabricate chips.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"SiPh 파운드리·CPO","d":"Semiconductor companies opening silicon photonics as a business — a sign that <b>industrial demand has appeared<\/b> in this field.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"전자-광 적층(CPO)","d":"Packaging that stacks the electronic die directly on the photonic die. The distance between them becomes minimal.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"비휘발 프로그래머블 마이크로링","d":"Ring-resonator arrays whose settings stay when the power is off. Tuning power drops to almost zero.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"포토닉 신경망","d":"A circuit that performs a neural network's multiply-accumulate with light. The crux is how to attach training and control.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"포토닉 리저버 컴퓨팅","d":"An approach that leaves complex optical dynamics as they are and <b>trains only the output stage<\/b>.","l":"L5","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"InP 스위칭·뉴로모픽","d":"An axis that switches optical signals on and off with InP amplifiers to build switches and neurons.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"CPO 메모리 인터페이스","d":"Research connecting memory and processor with light. The next bottleneck after HBM bandwidth is here.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광전자 국가연구소","d":"A large research base created by heavy state investment in optoelectronics.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"프로그래머블 PIC 이론","d":"The mathematical framework for using photonic circuits as general-purpose — which grid structures can make which transformations.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"프로그래머블 광 유니터리·ONN","d":"Circuits that implement arbitrary unitary matrices by changing only the phase of light, and the neural networks that use them.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"고Q 공진기·온칩 광원","d":"Resonators that trap light for a very long time, and on-chip sources that use them.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"서브파장 격자","d":"A technique that <b>designs a material's effective refractive index<\/b> with gratings finer than the wavelength.","l":"L3","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광 시뮬레이션 가속","d":"Research making waveguide and circuit simulation hundreds to thousands of times faster with numerical techniques.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"CPO 광 칩렛","d":"An implementation that makes the optical engine a chiplet and fits it into the processor package.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"플라즈모닉 변조기 상용화","d":"Plasmonic modulators moving from research into a company's product line.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"비선형 실리콘 포토닉스","d":"An axis using, in silicon circuits, the nonlinear effects that appear when light intensity grows.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"BTO 포켈스 변조기","d":"A modulator made of barium titanate. Its Pockels coefficient is tens of times that of lithium niobate.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"민간 SiPh 파운드리","d":"Silicon photonics contract manufacturing run by a company rather than the public sector.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"화합물반도체 팹","d":"A processing facility for III-V rather than silicon. Lasers and detectors come from here.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"집적포토닉스·광통신","d":"An axis covering on-chip photonic circuits together with the communication systems that use them.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"마이크로파 포토닉스","d":"An axis that puts microwave signals onto light to process them. Connected to radar and 5G.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"InP MPW·폴리머 EO","d":"A service fabricating indium-phosphide (InP) devices on shared wafers, and a platform built by adding EO materials to polymers. They handle <b>light emission and ultrafast modulation<\/b> that silicon cannot.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"CMOS 호환 EO 소자","d":"Electro-optic devices designed to be made as is on existing semiconductor volume lines (200/300 mm). <b>Manufacturability becomes the design constraint<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"집적 양자광학·GBS","d":"Experiments that generate and interfere photons on chip to draw distributions classical computers struggle to imitate (Gaussian boson sampling).","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"멤리스터 in-memory","d":"Finishing computation inside memory with electronic devices that remember resistance. <b>The same concern as optical PCM, just a different medium<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광컴 인재 양성망","d":"A European training network that <b>grows people<\/b> rather than running research projects. PhD positions appear as open calls, so it is accessible to foreign applicants.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"화합물반도체 클러스터","d":"An industry-academia bundle that gathers compound semiconductors such as III-V, from research to volume production, in one region.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"분산 양자 신경망","d":"Research connecting several quantum nodes with light to use them like one neural network. Its goal differs from optical computing.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"고주파 광전자","d":"Electronic and photonic devices operating at tens to hundreds of GHz. Modulator drivers hinge on this.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광섬유 통신·비선형","d":"An axis that understands and compensates nonlinear distortion arising in fiber. It sets the capacity limit of long-haul communications.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"응용광학·정밀공학","d":"The traditional optics axis of precisely making lenses, mirrors and free-space optical systems.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"집적 양자 포토닉스","d":"The branch handling quantum states at the single-photon level on chip.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광원·계측","d":"An axis that builds laser sources and uses them to measure distance and frequency.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"과제 목록","d":"The research projects currently running at this institution and their amounts.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"코히런트 이징 머신","d":"An optical machine that solves <b>combinatorial optimization<\/b>, not neural networks. Couple many light pulses and let them converge to the lowest-energy state, and that is the answer.","l":"L5","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"회절 광신경망 D²NN","d":"A structure that 3D-prints and stacks <b>several diffractive plates<\/b> instead of a chip, so inference finishes just by light passing through. It uses almost no power, but once made its weights cannot change.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"뉴로모픽 포토닉스","d":"The branch that builds, in light, devices that <b>fire a pulse once past threshold<\/b> like neurons in the brain. A different computing model from continuous-valued matrix multiplication.","l":"L5","dn":2,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"포토닉 역설계","d":"A method that fixes the desired function first and <b>solves for the structure backward<\/b>. It produces shapes people could not draw by intuition, often with better performance.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"물리 기반 연산","d":"An approach that <b>uses the physical process itself as computation<\/b>, not electronic circuits — as when light propagation and interference become matrix multiplication.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광 인터커넥트·데이터센터","d":"The layer that <b>connects with light<\/b> chip to chip and server to server. This field grew because moving data became more expensive than computing.","l":"L5","dn":5,"up":3,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"LNOI 이종집적·광 AI 가속기","d":"An axis that <b>bonds thin-film lithium niobate to silicon wafers at wafer scale<\/b> to make optical neural network chips. EO materials and AI accelerators meet in one person.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"칩간 광 연결·시스템","d":"Research that <b>ties several accelerators together with light<\/b> so they work like one system. Closer to network design than to devices.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"칼코게나이드 광메모리","d":"Research looking for ways to change the state of PCM materials <b>without melting them<\/b>. Because repeatedly melting and re-solidifying wrecks the device, PCM's biggest weakness.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"위상 포토닉스","d":"The branch that designs guiding structures topologically so that <b>light does not leak even at defects or bends<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"대규모 전자-광자 회로","d":"Attempts to put electronics and photonics on one circuit at <b>a scale of hundreds to thousands of devices<\/b>, not just a few.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"단일칩 광 신경망","d":"An implementation that puts the optical compute part and the electronic control part <b>all on one chip<\/b>. The form that appears when electronic circuit designers lead.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"유기 EO 재료","d":"<b>Organic polymers<\/b> whose refractive index changes strongly with voltage. Filled into gaps in silicon or plasmonic structures for low-voltage, high-speed modulation.","l":"L2","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"MEMS 포토닉스·광 신경망","d":"Changing optical paths by <b>physically moving<\/b> micromechanical structures. Almost no power and non-volatile, but slow.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광 신경망 이론·역설계","d":"The side that establishes mathematically, before building devices, <b>which optical structure corresponds to which neural network<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"프로그래머블 광 신경망","d":"An optical neural network that changes the phases of an interferometer grid electrically so <b>weights can be rewritten<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"프로그래머블 광 학습","d":"Attempts to do <b>training, not just inference, in the optical domain<\/b>. The crux is implementing backpropagation with light.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"비선형·양자 광파 AI","d":"An emerging axis that uses the nonlinearity and quantum properties of light as computational resources.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"이종집적 광컴 엔진","d":"An approach that builds optical compute engines by attaching chips of different materials.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광 뉴로모픽 소자","d":"Research building the optical devices themselves that remember and change values like synapses.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"실리콘 포토닉스 소자","d":"An axis that makes <b>basic parts<\/b> such as waveguides, resonators and modulators in silicon. Many standard parts in use today came from this lineage.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"비선형 광학·마이크로콤","d":"Research using how a material's response changes as light intensity grows, to make new wavelengths or comb-shaped light sources.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"메타광학 신경망","d":"The branch that replaces lenses or computation with <b>metasurfaces<\/b>, arrays of sub-wavelength structures.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"집적 광컴·역설계","d":"An axis that builds optical computing chips while designing their structures with AI.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"포토닉 텐서코어","d":"An optical compute core dedicated to matrix multiplication. The name corresponds to the GPU's tensor core.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"OEO 리저버 컴퓨팅","d":"Deliberately building a light→electronics→light conversion loop to get <b>delay and nonlinearity<\/b>, and using its complex dynamics for computation.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"전자-광 공동설계","d":"<b>Designing photonic devices and the electronic circuits that drive them together as one system<\/b> rather than separately. However good the modulator, if the driver cannot keep up the speed is not there, so the two are simulated and packaged together. The <b>multi-chip<\/b> approach of fabricating photonic and electronic chips in their own best processes and attaching them belongs here.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"실리콘 변조기","d":"A device that puts electrical signals onto light. Silicon cannot change its refractive index directly with voltage (no Pockels effect), so it detours by <b>changing the free-carrier concentration<\/b>, at the cost of absorption loss. Ring resonators are small and low-power but heat-sensitive; MZ interferometers are large but stable.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"그룹IV 포토닉스·플랫폼","d":"The branch making optical devices only from group IV elements such as silicon, germanium and tin. The same materials as CMOS, so <b>existing semiconductor fabs can be used as is<\/b> — the biggest advantage; but these materials emit light poorly, so lasers remain the homework.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"상변화물질","d":"Materials (PCM) whose refractive index changes strongly as they switch between crystalline and amorphous states. The state persists without power, making them <b>non-volatile optical memory<\/b> — used to store neural-network weights directly in the light path.","l":"L2","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"실리콘 포토닉스·파운드리","d":"Building factories that fabricate photonic chips and the systems for accessing them. The keys are <b>MPW<\/b>, which shares cost by putting several teams' designs on one wafer, and the <b>PDK<\/b> with design rules and part libraries. With these, labs can make chips without a fab.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"중공코어 광섬유","d":"Fiber where light travels through <b>empty air in the middle<\/b> rather than glass. Light is faster than in glass and has less loss and distortion, cutting latency. A technology from Southampton that Microsoft is deploying in its Azure network.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광섬유 증폭기(EDFA)","d":"A device that amplifies weakened light <b>as light, without converting it to electricity<\/b>. Pumping erbium-doped fiber amplifies the signal. It came from Southampton in 1987 and made intercontinental optical communications possible.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"시스템 PIC·광컴퓨팅","d":"The layer that <b>ties many devices into an on-chip circuit<\/b> rather than a single device. Modulators, switches and receivers are woven into arrays to build switch fabrics or compute cores. Judged by whole-system efficiency rather than individual device performance.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광 네트워크·시스템","d":"The layer that combines many optical links into data centers or networks. Performance is measured by link metrics such as <b>BER, latency and capacity<\/b>, not individual chips.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"그래핀·2D 포토닉스","d":"The branch that puts one-atom-thick materials on photonic circuits for modulation and detection. Very thin, so fast and low-power, but <b>depositing them uniformly at wafer scale<\/b> is still hard.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"PCM 광메모리","d":"Non-volatile memory that puts phase-change material on a waveguide and is <b>written with light and read with light<\/b>. Values stay without power, making it the basis of in-memory computing that fixes neural-network weights in photonic circuits.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"자유공간 광 신경망","d":"Matrix multiplication with <b>light traveling through air<\/b> rather than on-chip waveguides. Lenses and spatial light modulators (SLMs) handle thousands to tens of thousands of channels at once, giving great parallelism, at the cost of bulk and tricky alignment.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"PCM 광연산","d":"Computing where multiply-accumulate finishes just by passing through weights stored in PCM. <b>Memory and computation are in the same place<\/b>, so the cost of moving data disappears.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"BTO 극저온 EO","d":"Barium titanate (BaTiO₃) has <b>a very strong Pockels effect<\/b>, enabling ultrafast modulation at low voltage. It has been confirmed to work at cryogenic temperatures too, so it is used where superconducting circuits meet optical signals.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"집적 광양자","d":"The branch that generates and interferes single photons in on-chip circuits for quantum computation. Materials and processes overlap with optical computing, but <b>the goal differs<\/b> (quantum information, not compute acceleration).","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"나노가공 시설","d":"A research cleanroom. It does low-volume, high-precision processing such as e-beam lithography to prototype structures that standard foundry processes cannot make.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"에피택시·반도체 광원","d":"Processes that build semiconductor crystal layers on a substrate atom by atom (MBE · MOVPE). Silicon cannot emit light, so <b>light-emitting III-V crystal layers<\/b> must be grown separately and added — this is where those crystals come from.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"InP 레이저·변조기","d":"Indium phosphide (InP) <b>is a direct-bandgap semiconductor, so it emits light well<\/b> — the main material for lasers and high-speed modulators. But it is harder to make low-loss circuits than with silicon, so it is usually attached to silicon circuits.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"양자증폭기·나노광학","d":"Physics research that amplifies signals near the quantum noise limit or confines light with nanostructures. A different branch from optical computing and communications.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"photonic BiCMOS","d":"A process that fabricates high-speed electronics (SiGe bipolar + CMOS) and photonic devices <b>on the same wafer at once<\/b>. With electronics and photonics side by side, parasitics are small and efficiency is good, but process development is hard — in Europe only IHP has opened one.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"집적포토닉스·유기EO","d":"Filling narrow gaps in silicon or plasmonic structures with organic electro-optic polymers to get <b>ultrafast modulation at very low voltage<\/b>. Excellent performance, but the long-term stability of the material is the challenge.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"뉴로모픽·PCM","d":"The branch building neural networks from <b>devices that remember values<\/b>, like synapses in the brain. On the optical side, PCM plays the synapse.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"그룹IV 레이저","d":"Attempts to make lasers from silicon-family materials alone. These materials emit light poorly by nature, but mixing tin into germanium (GeSn) changes the band structure and enables emission — <b>a head-on solution to the on-chip source problem<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"Ge/GeSn 검출기","d":"Photodetectors made of germanium-family materials. They absorb <b>telecom wavelengths and mid-infrared<\/b> that silicon cannot see and turn them into current, compatible with CMOS processes.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"TFLN 광 가속기","d":"A compute device performing matrix multiplication with thin-film lithium niobate circuits. The Pockels effect lets values change <b>quickly and losslessly<\/b>, favoring analog computing.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광연산 이론","d":"The side that establishes, in equations and without building devices, <b>which physical process corresponds to which computation<\/b> — for example, how to get nonlinear computation from linear scattering alone.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"양자통신·계산 포토닉스","d":"Integrated optics for communications such as quantum key distribution, and simulation research that solves devices numerically. A different axis from fabricating optical computing devices.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"커스텀 나노가공","d":"Contract fabrication that makes <b>non-standard structures in small volumes<\/b> that standard MPWs cannot. Uses e-beam and nanoimprint together.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"zero-change EPIC","d":"Extracting photonic devices from an existing commercial CMOS process <b>without changing a single step<\/b>. The structures you can make are limited, but you inherit the progress of the latest electronic processes and go straight to volume production.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"모놀리식 CMOS 포토닉스","d":"The branch integrating electronics and photonics together on one chip. Short wiring between them cuts power and latency, but the demands of the two processes clash, making design tricky.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"전자-광 집적","d":"Research in the broad sense of tying transistors and photonic devices into one system. Attaching optical I/O directly to microprocessors is the typical example.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"박막 리튬나이오베이트","d":"A platform (TFLN) where lithium niobate (LiNbO₃) is <b>thinned to a film and bonded to a wafer<\/b>. With the Pockels effect it modulates losslessly above 100 GHz, but it is not a silicon process, so foundry access is narrow.","l":"L2","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"모놀리식 선형대수 가속기","d":"An approach that integrates the optical matrix-multiply core on one chip while designing <b>with the energy, area and calibration of electrical↔optical conversion included<\/b>. It confronts head-on the problem of a fast optical core losing out in conversion.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"TFLN 웨이퍼 집적","d":"Process research on <b>bonding TFLN to silicon circuits at wafer scale<\/b>, not lab scale. This is what makes TFLN a volume platform.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"TFLN 나노광학","d":"Research that carves microstructures such as photonic crystals into TFLN to <b>confine light in extremely small volumes<\/b>. The smaller the volume, the less voltage and energy the same modulation needs.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광 텐서코어·PCM","d":"A compute core that combines PCM memory arrays with wavelength multiplexing to process <b>convolutions in parallel at once<\/b>. A 2021 Nature paper is the reference point of this axis.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"이종집적 레이저","d":"Putting lasers on silicon by <b>bonding or transferring<\/b> other semiconductors such as InP. The current mainstream solution to silicon's inability to emit light, already in volume production.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"공용 MPW 파운드리","d":"A service that gathers several users' designs on one wafer to share cost. <b>With this, even students make chips<\/b> — the very entry barrier of this field.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"수출통제","d":"Rules restricting the transfer of technology and information abroad (ITAR · EAR etc.). They decide less the research itself than <b>which documents you can see and which meetings you can attend<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"광 리저버·공간광 신경망","d":"Leaving an intricately tangled optical medium <b>untrained, as it is<\/b>, and training only the output (reservoir computing). Combined with free-space optics it gives very many nodes cheaply.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"BTO·플라즈모닉 변조기","d":"Devices combining BaTiO₃ with metal nanostructures to <b>compress light into regions smaller than the wavelength<\/b> and modulate it. 200 GBd-class speeds, at the cost of metal loss.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"in-memory 컴퓨팅","d":"An approach that <b>finishes multiply-accumulate inside the memory<\/b> instead of moving data from memory to a compute unit. It matured first in electronics; PCM computing on the optical side is the same idea.","l":"L5","dn":2,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"마이크로콤","d":"A light source that produces <b>many evenly spaced wavelengths at once<\/b> in a small optical resonator. It reduces the number of sources in optical computing and communications that use one channel per wavelength.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"프로그래머블 PIC","d":"A photonic circuit whose interferometer grid is controlled electrically so <b>one chip performs many functions<\/b>. The optical counterpart of the FPGA.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광양자 회로","d":"Circuits that carve waveguides in glass or chips to interfere single photons. Femtosecond lasers are sometimes used to write 3D paths directly inside glass.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"폴라리톤·초고체 빛","d":"Research on quasiparticles (polaritons) formed by strong coupling of light and matter. They can make light interact with light, counted as one of <b>the detours toward digital optical computing<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"보손샘플링","d":"The problem of sampling the distribution that comes out of interfering photons over many paths. Hard for classical computers to imitate, so it is used in <b>quantum advantage<\/b> experiments.","l":"기타","dn":0,"up":0,"gs":["F"],"s":"보손샘플링","x":"An experiment that passes several photons through a mesh and draws output patterns. It aims at one thing only — <b>drawing a distribution classical computers struggle to imitate<\/b> — not general-purpose computing. The circuit is the same as the computing MZI mesh; the only difference is that the inputs are single photons.","w":true,"sid":"f1","c":"미분류"},{"t":"양자 포토닉스·클린룸","d":"A base where quantum light-source and circuit research sits together with the facilities to make them.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"해당 PI 없음","d":"Means that no researcher matching this axis (EO · fabless) was found in this survey. Not that the institution is weak, but that <b>its strength lies in another field<\/b>.","l":"기타","dn":0,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"CPO","d":"Co-Packaged Optics. Putting the optical transceiver inside the same package as the switch ASIC rather than at the end of a cable. Electrical wiring shrinks from cm to mm, cutting power. The only branch where money is flowing now.","l":"L6","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"트랜시버","d":"A module that turns electrical signals into light (transmit: laser + modulator) and light into electrical signals (receive: PD + TIA). Connects servers in data centers. 800G · 1.6T is the current generation.","l":"L6","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광 AI 가속기","d":"A chip that performs matrix multiplication by optical interference and intensity summation. Lightmatter Envise · Lightelligence · Q.ANT. No volume customers yet — the bottlenecks are ADC/DAC and precision.","l":"L6","dn":5,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"파운드리","d":"A factory that fabricates others' designs without designing. In photonics: GF · Tower · imec · AMF · IHP · TSMC. The premise that lets fabless designers exist.","l":"L6","dn":5,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"PDK","d":"Process Design Kit. A specification of “in this process, these devices can be made this way” — device library, design rules, models. You need it to draw your circuit on someone else's process.","l":"L6","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"EDA","d":"Electronic (Photonic) Design Automation. Software to draw, simulate and rule-check circuits. Synopsys · Ansys Lumerical · Luceda · open-source gdsfactory. Electronic-photonic co-simulation and optical LVS are still weak.","l":"L6","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광양자 산업","d":"PsiQuantum (photonic qubits on a GF process) · Xanadu (squeezed light) · Quandela (single-photon sources). The same parts box as optical accelerators, in that they use MZI meshes.","l":"L6","dn":1,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"직무","d":"PIC design / test · characterization / packaging / system architect / process development — five, estimated. There is a list of companies, but this cell is empty. It can only be filled by interviews with people in the job.","l":"L6","dn":6,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"아날로그 MVM 가속기","d":"Matrix-Vector Multiply. Vectors go in as light intensity or phase, pass through an MZI mesh or ring bank, and the matrix product is read with PDs. The real bottleneck is that input DACs and output ADCs eat 80% of system energy.","l":"L5","dn":6,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"O-E-O 논리","d":"Optical-Electrical-Optical. A gate that receives optical signals electrically, amplifies and decides, and sends them back out as light. The route that fills the gap where all-optical logic got stuck on gain and fan-out, using fF-class capacitance (NTT 2019).","l":"L5","dn":4,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"LOQC","d":"Linear Optical Quantum Computing. Feeds single photons into an MZI mesh to implement quantum gates by interference. The same circuit as optical computing that fixes phases as values — the only difference is the light intensity (one photon).","l":"L5","dn":2,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"weight-stationary","d":"Writing weights into the optical circuit once and only streaming changing inputs. If weights are rewritten electrically every time, that energy eats all the optical computing gain — which is why non-volatile PCM weights matter.","l":"L5","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"MZI","d":"Mach-Zehnder interferometer. Splits light in two, pushes the phase of one arm only and recombines. Interference at the junction is constructive or destructive depending on the phase difference, changing the output intensity. Modulator = phase shifter + MZI.","l":"L4","dn":3,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"MZI 메시","d":"MZIs stacked in a grid. With the Reck (1994) or Clements (2016) arrangement it becomes an arbitrary N×N unitary matrix. Light passing through is itself multiplying a vector by a matrix. Coherent (uses phase).","l":"L4","dn":4,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"마이크로링 가중치 뱅크","d":"One ring resonator per wavelength, with each ring's transmission as the weight. Summing per-wavelength intensities on one PD gives a dot product. Incoherent (intensity only) — no phase stabilization needed.","l":"L4","dn":4,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"WDM","d":"Wavelength Division Multiplexing. Carries several wavelengths in one waveguide to add channels. Bandwidth in communications, parallel channels (matrix rows) in computing.","l":"L4","dn":3,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"PCM 크로스바","d":"Waveguides crossed in a grid with phase-change material at each crossing, storing transmission (weights) non-volatilely. Combined with WDM inputs, in-memory matrix multiplication. The Oxford · Münster tensor core (Nature 2021).","l":"L4","dn":4,"up":3,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"E-O-E 링크","d":"Electrical→Optical→Electrical. Driver → modulator → waveguide → photodetector → TIA. The minimal circuit of the EO axis. Whether the modulator (optical) and driver (electronic) are made in the same process (monolithic) or made separately and attached (multi-chip) is the split in Ch.01 §1.4.5.","l":"L4","dn":8,"up":4,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"드라이버·TIA","d":"The driver is the electronic circuit that makes the voltage (several V, GHz) to swing a modulator. The TIA (Transimpedance Amplifier) is the receiving circuit that turns a PD's tiny current into voltage. Both are made in electronic processes (CMOS · BiCMOS).","l":"L4","dn":1,"up":3,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"ADC/DAC","d":"Analog↔digital converters. The electronic parts that put numbers into an optical accelerator (DAC) and read results (ADC). That this conversion eats more energy than optical computing itself is the structural bottleneck of optical accelerators.","l":"L4","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광 스위치·OCS","d":"Optical Circuit Switch. Changes only the path without converting light to electricity (MEMS mirrors · MZI trees). Circuit switching works, but packet switching is physically impossible for lack of optical buffers — application map §11.","l":"L4","dn":4,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"도파관","d":"A line that confines light by total internal reflection, wrapping a high-index core (Si n≈3.48) in low-index cladding (SiO₂ n≈1.44). 500 nm wide. The base of every device and the “carrying”.","l":"L3","dn":4,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"위상 천이기","d":"A device that pushes the phase of light passing a waveguide section by changing its refractive index. Δφ = 2π·Δn·L/λ. Speed and loss depend on the effect (thermal · carrier · Pockels). The most fundamental device.","l":"L3","dn":7,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"커플러","d":"A device that brings two waveguides close to split (splitter) or combine light. Directional couplers · Y-branches · MMI. Reciprocal, so splitting and combining are the same device — but when combining, any phase mismatch becomes loss.","l":"L3","dn":2,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"링 공진기","d":"A waveguide closed into a circle. Only light whose round trip is an integer number of wavelengths survives and circulates hundreds of times (Q). It amplifies weak effects Q times — one ring becomes a filter, modulator, sensor or weight. But it is extremely temperature-sensitive.","l":"L3","dn":5,"up":3,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"광검출기","d":"Light into current. Si cannot absorb 1550 nm, so Ge is grown epitaxially. UTC-PDs and APDs are high-speed and high-sensitivity variants. Where reception starts.","l":"L3","dn":3,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"레이저","d":"Makes light. Si has an indirect bandgap and cannot, so III-V such as InP is bonded or an off-chip external laser (ELS) is used. The “absence of an on-chip source” named in Ch.01 is now in its eleventh year.","l":"L3","dn":2,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"증폭기","d":"Amplifies light. Again Si cannot, so Er-doped waveguides (EDWA) or III-V SOAs. In optical computing, needed to restore the signal that shrinks with every cascade.","l":"L3","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"아이솔레이터","d":"Lets light through in one direction only, blocking reflections back into the laser. Needs magneto-optic material, but magnetic materials are contamination taboo in CMOS fabs — a discrete off-chip part.","l":"L3","dn":2,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"편광 소자","d":"Separates and rotates TE/TM. Polarization from fiber is random, so a polarization-diversity circuit that turns both into TE right at the input is needed — it takes considerable chip area.","l":"L3","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"그레이팅 커플러","d":"A grating on the chip surface couples vertically incident light into a waveguide (or a side edge coupler). Fiber alignment is at the µm level, a large share of assembly cost.","l":"L3","dn":2,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"SOI","d":"Silicon-on-Insulator. A 220 nm silicon layer on oxide. The standard substrate of silicon photonics — CORNERSTONE · imec · GF · AIM all use it. It has thermo-optics and carrier plasma, but no lasers or Pockels.","l":"L2","dn":2,"up":8,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"SiN","d":"Silicon nitride. Smaller Δn than Si, so weaker confinement, but much lower loss, transparent down to visible light, and Kerr (χ³) nonlinear — microcombs · quantum · biosensing. It cannot be switched fast electrically (thermal only).","l":"L2","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"Ge-on-Si","d":"Germanium grown epitaxially on SOI. 1550 nm detectors, electroabsorption modulators, mid-infrared. CORNERSTONE's lowest-cost platform (£8,875).","l":"L2","dn":2,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"BTO-on-Si","d":"A platform with BaTiO₃ film on Si. Pockels coefficient tens of times that of LN (unconfirmed) and works even at 4 K (Bristol · IBM Zurich). Process immature.","l":"L2","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"InP","d":"Indium phosphide. A direct bandgap, so lasers, amplification, detection and electroabsorption all in one material. Weak confinement and small, expensive wafers. HHI · SMART Photonics MPW.","l":"L2","dn":2,"up":4,"gs":[],"s":"","x":"","w":true,"sid":"","c":"입자"},{"t":"이종집적","d":"Mixing different materials on one chip — bonding III-V onto Si (lasers), adding TFLN (Pockels), coating with PCM (memory). The key word of L2, born because no single material does it all. Between monolithic and multi-chip.","l":"L2","dn":0,"up":3,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"포켈스 효과","d":"The χ² electro-optic effect. Applying an electric field E changes the refractive index linearly, Δn ∝ r·E. No charge movement, so lossless 100 GHz+ is possible. Only non-centrosymmetric crystals (LN · BTO · organics) — silicon is centrosymmetric and lacks it.","l":"L1","dn":1,"up":4,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"커 효과","d":"χ³ nonlinearity. Δn ∝ I with light intensity I. Present in all materials but weak, so it is boosted in resonators. Microcombs, all-optical switching and nonlinear activation functions come from here.","l":"L1","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"열광학 효과","d":"Changes refractive index with temperature (Si dn/dT ≈ 1.8×10⁻⁴/K). A single heater does it, losslessly, but it is slow (µs) and draws power. The standard phase shifter for computing and quantum circuits that fix values.","l":"L1","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"캐리어 플라즈마 분산","d":"Adding or removing free charge in a semiconductor changes refractive index and absorption together. The principle of Si modulators — GHz and low power, but absorption loss comes along. Silicon's detour around the missing Pockels effect.","l":"L1","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"전계흡수","d":"Changes the absorption coefficient with an electric field. Franz–Keldysh (bulk Ge) · QCSE (III-V quantum wells). The only electrical effect that changes intensity directly rather than phase — the principle of the EML (electroabsorption modulated laser). In bulk, the field tilts the bands and pushes the absorption edge; <b>in quantum wells it pushes the exciton peak itself<\/b>. In 1985 Miller et al. reported that the peak shifts to lower energy by up to <b>2.5× the zero-field binding energy<\/b> while remaining resolved up to ~10⁵ V/cm (PRB 32, 1043).","l":"L1","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"상변화","d":"Switching materials like GST · Sb₂Se₃ between crystalline ↔ amorphous with heat pulses. Large Δn, held without power (non-volatile). Writing is slow and there is fatigue. The material of optical weight memory.","l":"L1","dn":0,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"음향광학","d":"Sound waves (surface waves made piezoelectrically) form a refractive-index grating that diffracts and frequency-shifts light. SBS (stimulated Brillouin scattering) is the same family — microwave photonics · narrowband filters.","l":"L1","dn":2,"up":0,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"자기광학","d":"A magnetic field rotates polarization non-reciprocally (Faraday). The only principle of the isolator, but magnetic materials are taboo in CMOS fabs, so it cannot go on chip.","l":"L1","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"밴드간 이득·흡수","d":"Injecting current makes light through electron–hole recombination (lasers · SOAs), and incoming photons create charge (PDs). Only direct bandgaps (III-V) emit; Si is indirect and even borrows Ge to absorb (detect).","l":"L1","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"진폭","d":"The intensity of light. The only quantity a PD reads directly — so the output of every optical computation is ultimately intensity. Incoherent circuits use intensity only.","l":"L0","dn":0,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"위상","d":"Where along the wave you are. Invisible to the eye and to PDs, but combining two beams reveals it in intensity through interference. In linear optics, manipulating intensity, polarization and modes all reduces to phase differences + interference, so it is the most fundamental.","l":"L0","dn":3,"up":4,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"파장","d":"Color. Different wavelengths do not interfere and become independent channels (WDM). Bandwidth in communications, matrix rows (parallel) in computing.","l":"L0","dn":2,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"편광","d":"The direction the electric field oscillates. Chip waveguides have rectangular cross-sections, so TE and TM differ in index and loss. Polarization from fiber is random, so diversity circuits are needed.","l":"L0","dn":0,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"공간 모드","d":"The cross-sectional distribution light can take in a waveguide or free space. Multimode waveguides and diffractive neural networks (D²NN) carry numbers on spatial modes.","l":"L0","dn":2,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"코히런스","d":"How constant the phase stays (in time and space). Coherent MZI meshes use phase, so they need a single laser and stabilization; incoherent ring banks use intensity only and are insensitive to phase fluctuations. The first fork in circuit design.","l":"L0","dn":2,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"미분류"},{"t":"대역폭 ⭐","d":"⟵ root: ω. McMahon's 11 features ① (big 3). Photonics ~500 THz vs electronics ~5 GHz — 100,000 times. The WDM parallelism of running 10⁷ comb lines at once comes from here. But that is a chip-level comparison; per switch it shrinks to ~1000×.","l":"비교","dn":1,"up":3,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"공간 병렬성 ⭐","d":"⟵ root: ω (short λ). McMahon ② (big 3). More than 10⁶ spatial modes in parallel. In 2D, transistor density (10¹⁰/cm²) is 10,000× on-chip photonics (10⁶/cm²), a disadvantage; going 3D (bulk · free space) reverses it — (L/λ)²→(L/λ)³.","l":"비교","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"무손실 동역학 ⭐","d":"⟵ root: no interaction. McMahon ③ (big 3). A single lens does a Fourier transform, and linear optical propagation does matrix-vector multiplication, without dissipation. So computation is free and what is expensive is electrical↔optical conversion (I/O) — I/O is O(N) and computation O(N²), so it pays off for large N.","l":"비교","dn":1,"up":3,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"저손실 전송","d":"⟵ root: no interaction. McMahon ④. Attenuation per distance is orders of magnitude below electrical (~10⁴× at 10 GHz). Wire delay grows with the square of distance and needs repeaters — why optical interconnects entered data centers first.","l":"비교","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"교차 가능","d":"⟵ root: no interaction. McMahon ⑤. Beams and waveguides cross each other with crosstalk below −50 dB. Wires cannot. Free-space fan-out, waveguide crossbars and optical switches all owe it to this.","l":"비교","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"빔 조향","d":"⟵ root: waves (diffraction). McMahon ⑥. Acousto-optic deflectors re-plug beams on µs timescales → reconfigurable interconnects. Wire layouts are fixed at fabrication.","l":"비교","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"팬인·팬아웃","d":"⟵ root: no interaction. McMahon ⑦. Optics has fan-in/fan-out >1,000 without RC · LC delay (electronics ~10). Fan-in = gathering to one point with a lens (summation); fan-out = copying naturally. But with no gain, this becomes the wall in digital logic.","l":"비교","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"단방향 전파","d":"⟵ root: waves (k conservation). McMahon ⑧. Optical systems naturally flow one way. No backward problems like the sneak paths of electronic crossbars. But with reflections (interfaces) it is not perfect.","l":"비교","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"최소작용 원리","d":"⟵ root: not unique to light. McMahon ⑨. Fermat's least time · Onsager's least dissipation — lasers and OPOs oscillating in the minimum-loss mode is itself solving an optimization. The principle of optical Ising machines. Electrical circuits have no direct counterpart.","l":"비교","dn":0,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"실온 양자성","d":"⟵ root: ħω≫kT. McMahon ⑩. Photon energy (400–4000 meV) ≫ kT (26 meV), so single photons can be detected and manipulated at room temperature (microwaves need 10 mK). Few photons = low energy; squeezed states give precision.","l":"비교","dn":1,"up":2,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"파동 물리","d":"⟵ root: ω + no interaction. McMahon ⑪. Interference, diffraction, Fourier transforms — computations that come free because light is a wave. The waviness of single photons shows up in room-temperature MZIs (electrons need cryogenics, coherence length <250 µm). Bandwidth, spatial parallelism, quantumness and waviness all come from the single high carrier frequency ω.","l":"비교","dn":2,"up":3,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"큰 반송 주파수 ω","d":"Root ①. Light is an electromagnetic wave with a carrier frequency of 10¹⁴–10¹⁵ Hz (electronic circuits 10⁹–10¹⁰). The wavelength λ=c/ω is in µm, so many modes fit in a small volume. Of McMahon's 11 features, bandwidth, spatial parallelism, quantumness and waviness all branch from here — the author's own note.","l":"L0","dn":0,"up":6,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"광자끼리 상호작용 없음","d":"Root ②. Photons have no charge, so they neither push nor pull each other (perfect superposition in vacuum and linear media). So ⓐ there is no resistance or RC load like in wires (lossless · low loss · fan-in/out), ⓑ beams cross without mixing (crossing), and ⓒ coherence lengths are long (wave physics). The price — with no interaction, neither gain nor switching is free (separate nonlinear materials are needed).","l":"L0","dn":0,"up":9,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"ħω ≫ kT","d":"Root ③. Photon energy of 0.4–4 eV is tens to hundreds of times the 26 meV thermal energy at room temperature, so it is not buried in thermal noise → single-photon detection and manipulation at room temperature. Contrast with microwaves (µeV), which need 10 mK refrigerators. It is also a consequence of root ① (E=ħω).","l":"L0","dn":1,"up":1,"gs":[],"s":"","x":"","w":true,"sid":"","c":"관계"},{"t":"유니터리 행렬","d":"A matrix that does not change a vector's length when multiplied. Everything light does when passing without loss in linear optics has this form, so optical computing is <b>naturally unitary<\/b>.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"MZI 메시","x":"","w":false,"sid":"a1","c":"관계"},{"t":"Reck 분해","d":"A method of splitting an arbitrary N×N unitary into a product of 2×2 rotations (1994). It forms a triangular grid, and one MZI handles one of those 2×2s.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"MZI 메시","x":"","w":false,"sid":"a1","c":"관계"},{"t":"Clements 분해","d":"A method doing the same as Reck with a rectangular grid (2016). The number of stages light passes is spread evenly, so <b>loss is less lopsided<\/b>.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"MZI 메시","x":"","w":false,"sid":"a1","c":"관계"},{"t":"SVD 분해","d":"Splitting an arbitrary matrix into two unitaries and one diagonal. In photonic circuits it is implemented as <b>two meshes + attenuators<\/b> — because unitaries alone cannot make arbitrary matrices.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"MZI 메시","x":"","w":false,"sid":"a1","c":"관계"},{"t":"자유도","d":"How many knobs describe the circuit. A 4×4 unitary has 16 real numbers, and 6 MZIs × 2 phases + 4 output phases = exactly 16. The number of knobs is <b>set by mathematics<\/b>.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"MZI 메시","x":"","w":false,"sid":"a1","c":"관계"},{"t":"로렌츠 선형","d":"The bell-shaped curve a resonator's transmission traces over wavelength. Transmission is set by how far you are from resonance (detuning), and that value becomes the weight.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"마이크로링 가중치 뱅크","x":"","w":false,"sid":"a2","c":"관계"},{"t":"디튜닝","d":"How far from the resonance wavelength. A heater on the ring pushes this value to set the weight, but <b>when chip temperature changes, all four rings shift together<\/b> — why wavelength locking is needed.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"마이크로링 가중치 뱅크","x":"","w":false,"sid":"a2","c":"관계"},{"t":"광전류 합산","d":"Hit one detector with several wavelengths together and the photocurrents simply add. Getting addition <b>for free, without circuits<\/b> is the heart of wavelength-multiplexed computing.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"마이크로링 가중치 뱅크","x":"","w":false,"sid":"a2","c":"관계"},{"t":"프레넬 전파","d":"An approximation that computes how light spreads over a distance as a phase multiplication in the frequency domain. Everything between the layers of a diffractive neural network is this calculation.","l":"G:A","dn":0,"up":0,"gs":["A","E"],"s":"회절 신경망 D²NN","x":"","w":false,"sid":"a3","c":"관계"},{"t":"위상 마스크","d":"A plate that shifts the phase of light differently at each point. The weights of a diffractive neural network are engraved here, and <b>changing them means fabricating again<\/b>.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"회절 신경망 D²NN","x":"","w":false,"sid":"a3","c":"입자"},{"t":"4f 광학계","d":"Two lenses spaced by their focal length. The first lens does a Fourier transform, the middle plane is the frequency domain, and the second lens does the inverse, so <b>filtering finishes just by passing through<\/b>.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"4f 상관기","x":"","w":false,"sid":"a4","c":"입자"},{"t":"푸리에 면","d":"The middle plane of a 4f system. A plate placed here becomes a filter that multiplies each frequency by a different weight.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"4f 상관기","x":"","w":false,"sid":"a4","c":"입자"},{"t":"정합 필터","d":"Using the <b>conjugate spectrum<\/b> of the target pattern as the filter. Only when the input is that pattern do all the phases line up, raising a sharp peak at the output.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"4f 상관기","x":"","w":false,"sid":"a4","c":"입자"},{"t":"상관 봉우리","d":"The sharp value rising at a matched filter's output. The ratio of the peak to the mean is the strength of the decision, and its strength is that this ratio holds up well even with noise.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"4f 상관기","x":"","w":false,"sid":"a4","c":"관계"},{"t":"결정화·비정질화","d":"Switching a phase-change material between an ordered and a disordered state with heat pulses. That state changes the refractive index and <b>persists when the power is cut<\/b>.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"PCM 크로스바","x":"","w":false,"sid":"a5","c":"관계"},{"t":"쓰기 내구성","d":"How many times the same cell can be rewritten. Phase-change cells wear out with repeated melting and re-solidifying, a disadvantage for training where weights change often.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"PCM 크로스바","x":"","w":false,"sid":"a5","c":"관계"},{"t":"직접검출","d":"The simplest readout, measuring only light intensity. It sees the square of the electric field, so <b>the sign disappears and the value is squared<\/b> — negative weights cannot be used as is.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"호모다인 MVM","x":"","w":false,"sid":"a6","c":"관계"},{"t":"국부발진기","d":"The reference light (LO) sent to the detector along with the signal. As the signal interferes with this reference, <b>phase information is translated into intensity<\/b>, recovering negative and complex values.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"호모다인 MVM","x":"","w":false,"sid":"a6","c":"입자"},{"t":"호모다인 검출","d":"Reading by mixing in reference light at the same frequency as the signal. The result is proportional to the cos of the phase difference with the reference, so a stabilization circuit that holds that angle comes along.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"호모다인 MVM","x":"","w":false,"sid":"a6","c":"관계"},{"t":"시간다중","d":"Reusing one device with a different value every cycle. Space is saved, but <b>one computation takes N cycles<\/b>, so latency grows N times.","l":"G:A","dn":0,"up":0,"gs":["A","C"],"s":"시간다중 MVM","x":"","w":false,"sid":"a7","c":"관계"},{"t":"지연 대 처리량","d":"The time until one result appears and throughput per second are different axes. Time multiplexing increases latency to reduce area; spatial parallelism goes the other way.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"시간다중 MVM","x":"","w":false,"sid":"a7","c":"관계"},{"t":"공간광변조기","d":"A panel (SLM) that changes the phase or intensity of light per pixel. A large matrix can be loaded at once, but <b>one frame update takes milliseconds<\/b>.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"SLM 자유공간","x":"","w":false,"sid":"a8","c":"입자"},{"t":"병렬도","d":"The number of channels handled at once. Free space is parallel across all pixels, reaching tens to hundreds of thousands, at the cost of slow updates.","l":"G:A","dn":0,"up":0,"gs":["A"],"s":"SLM 자유공간","x":"","w":false,"sid":"a8","c":"관계"},{"t":"리저버 컴퓨팅","d":"An approach that leaves an intricately tangled medium <b>untrained, as it is<\/b>, and trains only one output layer. With the inside untouched, no backpropagation circuit is needed on chip, and it fits the “fixed random coupling” that light makes easily.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"리저버 컴퓨팅","x":"","w":false,"sid":"b1","c":"미분류"},{"t":"저수지","d":"The untrained internal mass in reservoir computing. Its nodes are tangled by mutual feedback, so <b>the input's past lingers in the state for a while<\/b> — that reverberation serves as memory.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"리저버 컴퓨팅","x":"","w":false,"sid":"b1","c":"입자"},{"t":"읽기층","d":"The final linear layer that takes the reservoir's current state and turns it into an answer. It is <b>the only trained part<\/b> of a reservoir, so a single linear regression finishes training.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"리저버 컴퓨팅","x":"","w":false,"sid":"b1","c":"입자"},{"t":"스펙트럴 반경","d":"The largest magnitude among the eigenvalues of the reservoir coupling matrix. It sets <b>how long memory lasts<\/b> — too small and inputs vanish quickly; well above 1 and the state runs wild.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"리저버 컴퓨팅","x":"","w":false,"sid":"b1","c":"관계"},{"t":"누설률","d":"The fraction of a new value a node accepts at each step. Low means dragging the old state along for long, suiting slow signals; high means following quickly, suiting short memory.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"리저버 컴퓨팅","x":"","w":false,"sid":"b1","c":"관계"},{"t":"릿지 회귀","d":"Linear regression with a penalty added to least squares to suppress overfitting. Used to solve the reservoir's readout <b>in one shot, without iterative training<\/b>.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"리저버 컴퓨팅","x":"","w":false,"sid":"b1","c":"관계"},{"t":"NRMSE","d":"The root mean squared error divided by the standard deviation of the target. 0 is perfect, 1 is <b>no better than answering the mean<\/b>, so tasks with different units can be compared.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"리저버 컴퓨팅","x":"","w":false,"sid":"b1","c":"관계"},{"t":"적분발화","d":"The simplest family of neuron models. Input accumulates in the membrane potential until it crosses threshold, fires once and resets to 0. The equation is τ·dV/dt = −V + I(t).","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"스파이킹 광 뉴런","x":"","w":false,"sid":"b2","c":"관계"},{"t":"역치","d":"The reference value at which a spike goes out the moment the membrane potential crosses it. If the threshold is above the input strength, <b>no spike comes out however long you wait<\/b> — because the potential fills only up to the input value.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"스파이킹 광 뉴런","x":"","w":false,"sid":"b2","c":"관계"},{"t":"불응기","d":"The dead time right after firing during which the next spike cannot fire. It <b>directly sets the ceiling<\/b> on firing rate (ceiling = 1/refractory period).","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"스파이킹 광 뉴런","x":"","w":false,"sid":"b2","c":"관계"},{"t":"공명터널다이오드","d":"RTD. A device with a region where current drops as voltage rises (negative differential resistance). That region creates integration, firing and refractoriness on the electronic side, and the attached laser emits them as optical pulses.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"스파이킹 광 뉴런","x":"","w":false,"sid":"b2","c":"입자"},{"t":"곱셈누적","d":"MAC. The paired operation of multiplying and adding, the basic unit of neural-network computation. 1 MAC is usually counted as 2 OPs, so when reading TOPS figures check <b>which way they were counted<\/b>.","l":"G:B","dn":0,"up":0,"gs":["B","E"],"s":"포토닉 텐서코어","x":"","w":false,"sid":"b3","c":"관계"},{"t":"파장 다중","d":"WDM. Running several beams of different colors together in the same waveguide. The point is multiplying <b>only throughput<\/b> by the number of wavelengths without adding devices; efficiency (TOPS/W) does not rise with it.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"포토닉 텐서코어","x":"","w":false,"sid":"b3","c":"관계"},{"t":"상변화 재료","d":"PCM. A material whose crystalline/amorphous state changes depending on how it is melted and solidified, changing its optical transmission. <b>Its value stays when the power is off<\/b>, so it is used to store weights, but rewriting requires melting, which is slow and limited in endurance.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"포토닉 텐서코어","x":"","w":false,"sid":"b3","c":"입자"},{"t":"TOPS/W","d":"How many trillion operations per second per watt. With optical accelerator figures, <b>whether only the core was counted or ADCs, lasers and drivers too<\/b> changes the order of magnitude, and paper figures are usually core-only.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"포토닉 텐서코어","x":"","w":false,"sid":"b3","c":"관계"},{"t":"ADC","d":"A converter that turns a detector's analog current into digital numbers. However cheap the optical computation, <b>it runs once per output<\/b>, so it often dominates system power — this is often the real bottleneck of optical accelerators.","l":"G:B","dn":0,"up":0,"gs":["B","E"],"s":"포토닉 텐서코어","x":"","w":false,"sid":"b3","c":"입자"},{"t":"χ² 비선형","d":"Two beams mixing in a second-order nonlinear medium to produce sum/difference frequencies. As the pump depletes the output saturates, and that compression <b>acts as a neural network's activation function<\/b>.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"전광 RNN","x":"","w":false,"sid":"b4","c":"관계"},{"t":"되먹임 이득","d":"How many times larger the light returns after one round of the loop. Above 1 the state grows, and if the loop's round-trip phase is π <b>the sign flips<\/b>, so oscillation builds instead of convergence.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"전광 RNN","x":"","w":false,"sid":"b4","c":"관계"},{"t":"되먹임 지연","d":"How many rounds later the current state comes back. The longer the delay, the longer the oscillation period (in a sign-flipped loop, the period is twice the delay).","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"전광 RNN","x":"","w":false,"sid":"b4","c":"관계"},{"t":"RPE-PPLN","d":"Periodically poled lithium niobate used as <b>a bulk crystal, not a chip<\/b>. It is the element that handled the nonlinearity in the 100 GHz-class all-optical feedback experiment, so its performance must not be read directly as TFLN chip performance.","l":"G:B","dn":0,"up":0,"gs":["B"],"s":"전광 RNN","x":"","w":false,"sid":"b4","c":"입자"},{"t":"이징 모형","d":"A magnet model where each spin is either +1 or −1 and the couplings J with neighbors set the total energy. Energy may be lower when spins align or when they oppose, and the sign of J decides which. Many optimization problems can be rewritten in this form (Lucas 2014).","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"Max-Cut","d":"The problem of splitting a graph's vertices into two sides so as to maximize the number of edges connecting different sides (<b>the cut value<\/b>). The sign of each spin is the side, so it translates directly into Ising — with Ising energy H = number of edges − 2 × cut.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"결합 행렬 J","d":"The matrix collecting how strongly spins i and j attract or repel each other. This matrix is the problem to be solved, and machines differ in <b>which J they can implement<\/b>.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"축퇴 OPO","d":"An optical parametric oscillator in which one pump photon splits into two photons of the same wavelength. The moment it crosses threshold its phase locks to either 0 or π, and those two branches are mapped to spins +1 and −1.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"입자"},{"t":"펌프 램프","d":"Raising the pump intensity slowly from below threshold to above. <b>Slowness is the condition<\/b> — raise it fast and several modes cross threshold at once and mix, and the minimum-gain argument does not hold at all.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"포화 이득","d":"The property that gain shrinks as amplitude grows. It is the −x² term in the dynamics ẋ = (p−1−x²)x, and it is what keeps the amplitude from growing without bound, settling at fixed points such as ±√(p−1).","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"최소 이득 논증","d":"The <b>design logic<\/b> that the mode with the lowest loss oscillates first. But it is <b>not a guarantee<\/b> that this mode is the lowest-energy solution — it is an idealization assuming no noise, and in practice continuous relaxation and amplitude heterogeneity break it. So it is run many times and the statistics are examined. This is the most frequently exaggerated point in the field.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"연속 완화","d":"The problem with the ±1 constraint on spins released, allowing real values. Easy to solve, but there is no guarantee that rounding its solution by sign gives the optimum of the original Ising problem. The mode that turns on first near threshold is exactly the solution of this relaxed problem.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"진폭 비균일","d":"Oscillators turning on at different strengths. With uneven amplitudes, the minimum of the potential the machine actually descends is offset from the minimum of the target Ising Hamiltonian. Error-correcting feedback that pulls amplitudes toward a common target has been proposed, but the authors themselves write that it solves this only “partially”.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"국부 최적","d":"A place where flipping any one spin cannot go lower, but which is not the global minimum. Their number grows exponentially as the problem size increases.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"측정-피드백","d":"Detecting the pulses, having an FPGA compute Σ J_ij x_j <b>digitally<\/b>, and putting the result back onto light to form the coupling. This is the approach that reached scale in place of optical delay lines, and the advantage of writing J almost freely is a cost paid by electronics.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"측정-되먹임 지연","d":"When detection, AD conversion, FPGA computation and modulation together take longer than one round trip, the machine does not run at all. With dense coupling one round needs N² multiplications, so doubling the spins quadruples the required throughput.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"라운드트립","d":"The time for a pulse to go once around the fiber loop. It corresponds to one Ising update. For a 1 km loop it is about 4.9 µs in silica fiber.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"슬롯","d":"The round trip divided by the number of spins — the place one pulse occupies. With 2000 spins in a 1 km loop it is about 2.45 ns, and if its inverse, the repetition rate, exceeds the modulator bandwidth, the loop must be lengthened.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"코히런트 이징 머신","x":"","w":false,"sid":"c1","c":"관계"},{"t":"SLM","d":"Spatial light modulator. A panel that changes the phase or intensity of light per pixel, with one pixel being one spin. It can hold tens of thousands of spins, but swapping one frame takes milliseconds.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"공간광 이징 머신","x":"","w":false,"sid":"c2","c":"입자"},{"t":"Mattis 결합","d":"A <b>low-rank<\/b> coupling where J_ij is built by summing products of a few patterns ξ. It lets the total energy be measured at once just by focusing light to a point, but in exchange an arbitrary J cannot be used.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"공간광 이징 머신","x":"","w":false,"sid":"c2","c":"관계"},{"t":"담금질","d":"A search method that starts at a high temperature and lowers it, occasionally accepting moves that raise the energy so as to escape local optima. The fraction accepted is the acceptance rate.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"공간광 이징 머신","x":"","w":false,"sid":"c2","c":"관계"},{"t":"글라우버 동역학","d":"An update that picks one spin and resets it probabilistically according to the field its neighbors create. Run long enough and its dwell frequencies converge to <b>the Boltzmann distribution<\/b> — a route to a distribution rather than a single answer.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"이징 샘플러","x":"","w":false,"sid":"c3","c":"관계"},{"t":"볼츠만 분포","d":"A distribution where lower-energy states appear more often by exp(−H/T). At low temperature it concentrates on the ground state; at high temperature it spreads over many solutions. This is where machines that reduce noise to find one answer part ways with machines that keep noise to sample a distribution.","l":"G:C","dn":0,"up":0,"gs":["C"],"s":"이징 샘플러","x":"","w":false,"sid":"c3","c":"관계"},{"t":"이득","d":"A device's ability to make its output larger than its input. The primary reason digital all-optical computing got stuck was not the clock but <b>gain, fan-out and energy<\/b> — there was no good way to do with light alone what transistors do, drawing gain from the power supply.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"S-SEED","x":"","w":false,"sid":"d1","c":"관계"},{"t":"팬아웃","d":"How many next-stage gates one gate's output can drive. Splitting the output in two halves the intensity, and <b>without gain that half cannot be made up<\/b>.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"전광 논리 게이트","x":"","w":false,"sid":"d2","c":"관계"},{"t":"소광비","d":"The intensity ratio of “1” to “0”. As stages are chained the “0” level rises and this value erodes, until at some stage the logic no longer holds.","l":"G:D","dn":0,"up":0,"gs":["D","M"],"s":"전광 논리 게이트","x":"","w":false,"sid":"d2","c":"관계"},{"t":"캐스케이드","d":"Connecting a gate's output directly as the next gate's input. <b>One stage working and a circuit standing are different problems<\/b>, and all-optical logic usually got stuck here.","l":"G:D","dn":0,"up":0,"gs":["D","E"],"s":"전광 논리 게이트","x":"","w":false,"sid":"d2","c":"관계"},{"t":"래치","d":"Holding the previous state even when the input becomes ambiguous. An S-SEED keeps its state even when the ratio of the two beams comes back near 1.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"S-SEED","x":"","w":false,"sid":"d1","c":"관계"},{"t":"QCSE (양자구속 슈타르크 효과)","d":"Applying a field shifts the exciton absorption line of a quantum well toward lower energy. Seen at a fixed wavelength, absorption traces a <b>peak<\/b> versus voltage, and that peak is the root of the S-SEED latch.","l":"G:D","dn":0,"up":0,"gs":["D"],"s":"S-SEED","x":"","w":false,"sid":"d1","c":"관계"},{"t":"SOA (반도체 광증폭기)","d":"A device that amplifies light in a current-pumped s
