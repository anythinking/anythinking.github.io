>연산과 뇌-기계 인터페이스<\/b> 양쪽에 쓰는 축. 가시광에서도 동작하는 실리콘 포토닉스가 핵심 기술.","집적포토닉스·수신기":"광 신호를 받아 전기로 바꾸는 회로와 그 집적. 변조기의 반대편.","멤리스티브 포토닉스":"저항이 기억되는 소자를 광회로에 결합해 <b>시냅스처럼 값을 저장<\/b>하는 축.","Si 위 양자점 레이저":"실리콘 기판 위에 양자점 결정을 직접 길러 레이저를 만드는 것. <b>온칩 광원 문제의 정공법<\/b> 중 하나.","광 합성곱 가속기":"신경망의 합성곱 연산을 광회로에서 처리하는 장치. 조정 가능한 커플러와 지연선으로 만든다.","Si PIC·APD":"실리콘 광회로에 <b>애벌란시 포토다이오드<\/b>(약한 빛을 증폭해 검출)를 함께 넣는 기술.","어븀 도프 실리콘 나노포토닉스":"실리콘 나노구조에 어븀을 심어 <b>스핀-광자 인터페이스<\/b>를 만드는 축. 양자 쪽에 가깝다.","화합물반도체":"실리콘이 아닌 III-V 계열 반도체 전반.","광 RAM·전광 스위칭":"빛을 전자로 바꾸지 않고 <b>빛인 채로 값을 붙잡아 두는<\/b> 소자. 포토닉 결정으로 캐비티를 극소화해 30 nW로 유지한 것이 이 그룹의 기록이다.","광전융합 디바이스":"전자 회로와 광 회로를 하나의 장치로 융합하는 NTT의 IOWN 구상. 통신망을 넘어 <b>컴퓨터 내부<\/b>로 광을 들여오는 단계까지 왔다.","III-V/Si 변조기·CPO":"실리콘 위에 III-V를 얹어 변조기를 만들고 그걸 프로세서 옆에 붙이는(co-packaged optics) 축.","SiPh MPW 파운드리":"실리콘 포토닉스 칩을 공용 웨이퍼로 찍어주는 곳. <b>여기 접근권이 곧 연구 가능성<\/b>이다.","프로그래머블 광 프로세서":"간섭계 격자를 전기로 바꿔 한 칩으로 여러 기능을 하게 만든 광회로 — FPGA의 광학판. iPRONICS가 이걸 실제로 판다.","광IO·패키징":"칩에서 빛을 꺼내 광섬유에 잇고 전체를 하나의 부품으로 조립하는 공정. <b>PIC 제조원가의 큰 몫<\/b>이고 학계에 거점이 드물다.","전사인쇄 이종집적":"다른 웨이퍼에서 만든 얇은 소자를 <b>도장 찍듯 옮겨 붙이는<\/b> 방법. 레이저를 실리콘에 얹는 현실적 수단 중 하나.","PZT·BTO 변조기":"실리콘 위에 강유전체를 올려 <b>포켈스 효과<\/b>를 얻는 접근. 실리콘에 없는 성질을 재료로 빌려온다.","플라즈모닉 EO":"금속 표면의 전자 진동에 빛을 실어 <b>파장보다 작은 공간<\/b>에 가둔 뒤 변조하는 방식. 극도로 작고 빠르지만 금속 손실이 대가.","도파관 증폭기(EDWA)":"광섬유 증폭기(EDFA)를 칩 위 도파관으로 옮긴 것. 광회로가 길어질수록 생기는 손실을 <b>빛인 채로 되살린다<\/b>.","InP 파운드리·MPW":"인듐인 기반 칩을 공용 웨이퍼로 찍어주는 서비스. 레이저가 필요한 설계는 여기를 지난다.","SiPh 위 CMOS 집적":"실리콘 포토닉스 공정을 바꾸지 않고 그 위에 전자 회로를 얹는 접근. 모놀리식과 멀티칩 사이의 절충.","TFLN 파운드리":"박막 리튬나이오베이트 칩을 찍어주는 곳. 최근 몇 년 사이 생긴 새 업종이고 <b>스위스에 몰려 있다<\/b>.","UTC-PD 검출기":"Uni-Travelling-Carrier 포토다이오드 — 전자만 움직이게 해 <b>초고속·고출력<\/b>을 동시에 얻는 검출기 구조.","300mm SiPh 공정":"12인치 웨이퍼로 실리콘 포토닉스를 만드는 라인. 양산 규모라 <b>연구 결과가 산업으로 바로 넘어간다<\/b>.","박사 펠로십":"대학이 아니라 <b>국가가 직접 주는<\/b> 박사 장학금. 지도교수 자금과 무관하게 자리가 생긴다.","국가 나노팹":"정부가 운영하는 공용 반도체 가공 시설. 공개 MPW가 있으면 학생도 칩을 찍을 수 있다.","SiPh 파운드리·CPO":"반도체 기업이 실리콘 포토닉스를 사업으로 여는 것 — 이 분야에 <b>산업 수요가 생겼다<\/b>는 신호.","전자-광 적층(CPO)":"전자 다이를 광 다이 위에 직접 쌓는 패키징. 둘 사이 거리가 최소가 된다.","비휘발 프로그래머블 마이크로링":"전원을 꺼도 설정이 남는 링 공진기 배열. 튜닝 전력이 거의 0이 된다.","포토닉 신경망":"빛으로 신경망의 곱셈-누적을 수행하는 회로. 학습·제어를 어떻게 붙이느냐가 관건.","InP 스위칭·뉴로모픽":"InP 증폭기로 광 신호를 켜고 끄며 스위치와 뉴런을 만드는 축.","CPO 메모리 인터페이스":"메모리와 프로세서 사이를 광으로 잇는 연구. HBM 대역폭의 다음 병목이 여기다.","광전자 국가연구소":"국가가 광전자에 집중 투자해 만든 대형 연구 거점.","프로그래머블 PIC 이론":"광회로를 범용으로 쓰는 수학적 틀 — 어떤 격자 구조가 어떤 변환을 만들 수 있나.","프로그래머블 광 유니터리·ONN":"빛의 위상만 바꿔 임의의 유니터리 행렬을 구현하는 회로와 그걸 쓴 신경망.","고Q 공진기·온칩 광원":"빛을 아주 오래 가두는 공진기와 그걸 이용한 칩 위 광원.","광 시뮬레이션 가속":"도파로·회로 시뮬레이션을 수치 기법으로 수백~수천 배 빠르게 만드는 연구.","CPO 광 칩렛":"광 엔진을 칩렛 형태로 만들어 프로세서 패키지에 끼우는 구현.","플라즈모닉 변조기 상용화":"연구 단계의 플라즈모닉 변조기가 기업 제품 라인으로 넘어간 것.","비선형 실리콘 포토닉스":"빛의 세기가 커지면 생기는 비선형 효과를 실리콘 회로에서 쓰는 축.","BTO 포켈스 변조기":"바륨티타네이트로 만든 변조기. 포켈스 계수가 리튬나이오베이트의 수십 배다.","민간 SiPh 파운드리":"공공이 아니라 회사가 운영하는 실리콘 포토닉스 위탁 생산.","화합물반도체 팹":"실리콘이 아닌 III-V 계열을 다루는 가공 시설. 레이저·검출기가 여기서 나온다.","집적포토닉스·광통신":"칩 위 광회로와 그걸 쓴 통신 시스템을 함께 다루는 축.","마이크로파 포토닉스":"마이크로파 신호를 빛에 실어 처리하는 축. 레이더·5G와 이어진다.","InP MPW·폴리머 EO":"인듐인(InP) 기반 소자를 공용 웨이퍼로 찍어주는 서비스와, 폴리머에 EO 재료를 넣어 만드는 플랫폼. 실리콘으로 안 되는 <b>발광·초고속 변조<\/b>를 맡는다.","CMOS 호환 EO 소자":"기존 반도체 양산 라인(200/300 mm)에서 그대로 만들 수 있게 설계한 전기광학 소자. <b>양산성이 곧 설계 제약<\/b>이 된다.","집적 양자광학·GBS":"칩 위에서 광자를 만들고 간섭시켜 고전 컴퓨터가 흉내 내기 힘든 분포를 뽑는 실험(가우시안 보손 샘플링).","멤리스터 in-memory":"저항이 기억되는 전자 소자로 메모리 안에서 연산을 끝내는 방식. 광 PCM과 <b>문제의식이 같고 매체만 다르다<\/b>.","광컴 인재 양성망":"연구 과제가 아니라 <b>사람을 키우는<\/b> 유럽 훈련망. 박사 자리가 공고로 뜨는 구조라 외국 지원자에게 접근성이 좋다.","화합물반도체 클러스터":"III-V 같은 화합물 반도체를 연구부터 양산까지 한 지역에 모아놓은 산업·학계 묶음.","분산 양자 신경망":"여러 양자 노드를 광으로 이어 하나의 신경망처럼 쓰는 연구. 광컴퓨팅과는 목표가 다르다.","고주파 광전자":"수십~수백 GHz에서 동작하는 전자·광 소자. 변조기 드라이버가 여기 걸린다.","광섬유 통신·비선형":"광섬유에서 생기는 비선형 왜곡을 이해하고 보상하는 축. 장거리 통신 용량의 한계를 정한다.","응용광학·정밀공학":"렌즈·거울·자유공간 광학계를 정밀하게 만드는 전통 광학 축.","집적 양자 포토닉스":"단일 광자 수준의 양자 상태를 칩 위에서 다루는 갈래.","광원·계측":"레이저 광원을 만들고 그걸로 거리·주파수를 재는 축.","과제 목록":"이 기관에서 지금 돌아가는 연구 과제와 금액.","회절 광신경망 D²NN":"칩이 아니라 <b>회절판 여러 장<\/b>을 3D 프린트해 쌓고, 빛이 그걸 통과하는 것만으로 추론이 끝나게 만든 구조. 전력이 거의 안 들지만 한 번 만들면 가중치를 못 바꾼다.","포토닉 역설계":"원하는 기능을 먼저 정하고 <b>구조를 거꾸로 푸는<\/b> 방법. 사람이 직관으로 못 그리는 모양이 나오는데 성능이 더 좋을 때가 많다.","물리 기반 연산":"전자 회로가 아니라 <b>물리 과정 자체를 계산으로 쓰는<\/b> 접근. 빛의 전파·간섭이 곧 행렬 곱이 되는 식.","LNOI 이종집적·광 AI 가속기":"박막 리튬나이오베이트를 실리콘 웨이퍼에 <b>웨이퍼 단위로 붙여<\/b> 광 신경망 칩을 만드는 축. EO 재료와 AI 가속기가 한 사람 안에서 만난다.","칩간 광 연결·시스템":"가속기 여러 대를 <b>광으로 묶어<\/b> 한 시스템처럼 쓰게 만드는 연구. 소자가 아니라 네트워크 설계에 가깝다.","칼코게나이드 광메모리":"PCM 재료를 <b>녹이지 않고<\/b> 상태를 바꾸는 방법을 찾는 연구. 녹였다 굳히기를 반복하면 소자가 망가지는 게 PCM의 최대 약점이라서.","위상 포토닉스":"도파 구조를 위상학적으로 설계해 <b>결함이나 굽힘에도 빛이 새지 않게<\/b> 만드는 갈래.","대규모 전자-광자 회로":"소자 몇 개가 아니라 <b>수백~수천 소자 규모<\/b>로 전자와 광을 한 회로에 올리는 시도.","단일칩 광 신경망":"광 연산부와 전자 제어부를 <b>한 칩 안에<\/b> 다 넣은 구현. 전자 회로 설계자가 주도할 때 나오는 형태.","MEMS 포토닉스·광 신경망":"미세 기계 구조로 <b>물리적으로 움직여<\/b> 광 경로를 바꾸는 방식. 전력이 거의 안 들고 비휘발성이지만 느리다.","광 신경망 이론·역설계":"소자를 만들기 전에 <b>어떤 광 구조가 어떤 신경망에 대응하는지<\/b>를 수학으로 세우는 쪽.","프로그래머블 광 신경망":"간섭계 격자의 위상을 전기로 바꿔 <b>가중치를 다시 쓸 수 있게<\/b> 만든 광 신경망.","프로그래머블 광 학습":"추론만이 아니라 <b>학습까지 광영역에서<\/b> 하려는 시도. 역전파를 빛으로 구현하는 게 관건.","비선형·양자 광파 AI":"빛의 비선형성과 양자적 성질을 계산 자원으로 쓰는 신생 축.","이종집적 광컴 엔진":"서로 다른 재료의 칩을 붙여 광 연산 엔진을 만드는 접근.","광 뉴로모픽 소자":"시냅스처럼 값을 기억하고 바꾸는 광 소자 자체를 만드는 연구.","실리콘 포토닉스 소자":"도파관·공진기·변조기 같은 <b>기본 부품<\/b>을 실리콘으로 만드는 축. 지금 쓰이는 표준 부품 상당수가 이 계보에서 나왔다.","비선형 광학·마이크로콤":"빛의 세기가 세지면 재료의 반응이 달라지는 현상을 이용해 새 파장을 만들거나 빗살 모양 광원을 얻는 연구.","메타광학 신경망":"파장보다 작은 구조를 배열한 <b>메타표면<\/b>으로 렌즈나 연산을 대체하는 갈래.","집적 광컴·역설계":"광 연산 칩을 만들면서 그 구조를 AI로 설계하는 축.","포토닉 텐서코어":"행렬 곱 전용 광 연산 코어. GPU의 텐서코어에 대응하는 이름.","OEO 리저버 컴퓨팅":"빛→전자→빛 변환 고리를 일부러 만들어 <b>지연과 비선형<\/b>을 얻고, 그 복잡한 동역학을 계산에 쓰는 방식.","전자-광 공동설계":"광 소자와 그걸 구동하는 전자 회로를 <b>따로 만들지 않고 한 시스템으로 같이 설계<\/b>하는 일. 변조기만 잘 만들어도 드라이버가 못 따라오면 속도가 안 나오니, 둘을 함께 시뮬레이션하고 함께 패키징한다. 광 칩과 전자 칩을 각자 최적 공정에서 찍어 붙이는 <b>멀티칩<\/b> 방식이 여기 속한다.","실리콘 변조기":"전기 신호를 빛에 싣는 소자. 실리콘은 전압으로 굴절률을 직접 못 바꿔서(포켈스 효과가 없다) <b>자유전자 농도를 바꿔<\/b> 우회하는데, 그 대가로 흡수 손실이 따라온다. 링 공진기를 쓰면 작고 저전력이지만 열에 민감하고, MZ 간섭계를 쓰면 크지만 안정적이다.","그룹IV 포토닉스·플랫폼":"실리콘·게르마늄·주석처럼 주기율표 4족 원소만으로 광 소자를 만드는 갈래. CMOS 공정과 재료가 같아 <b>기존 반도체 공장을 그대로 쓸 수 있다<\/b>는 게 최대 장점이고, 대신 이 재료들은 빛을 잘 내지 못해 레이저가 숙제로 남는다.","실리콘 포토닉스·파운드리":"광 칩을 찍어주는 공장과 그 접근 체계를 만드는 일. 여러 팀의 설계를 한 웨이퍼에 얹어 비용을 나누는 <b>MPW<\/b>와, 설계 규칙·부품 라이브러리를 담은 <b>PDK<\/b>가 핵심이다. 이게 있어야 연구실이 팹 없이도 칩을 만들 수 있다.","중공코어 광섬유":"빛이 유리가 아니라 <b>가운데 빈 공기<\/b>를 지나가게 만든 광섬유. 유리보다 빛이 빠르고 손실·왜곡이 적어 지연이 줄어든다. 사우샘프턴에서 나와 마이크로소프트가 Azure 망에 깔고 있는 기술.","광섬유 증폭기(EDFA)":"약해진 빛을 <b>전기로 바꾸지 않고 빛인 채로<\/b> 증폭하는 장치. 어븀을 섞은 섬유에 펌프 광을 넣으면 신호가 증폭된다. 1987년 사우샘프턴에서 나왔고, 이것 덕분에 대륙 간 광통신이 가능해졌다.","시스템 PIC·광컴퓨팅":"소자 하나가 아니라 <b>여러 소자를 한 칩 위 회로로 묶는<\/b> 층. 변조기·스위치·수신기를 배열로 엮어 스위치 패브릭이나 연산 코어를 만든다. 개별 소자 성능보다 전체 시스템의 효율이 판정 기준.","광 네트워크·시스템":"광 링크를 여러 개 묶어 데이터센터나 통신망을 구성하는 층. 개별 칩이 아니라 <b>BER·지연·용량<\/b> 같은 링크 지표로 성능을 잰다.","그래핀·2D 포토닉스":"원자 한 층 두께의 재료를 광회로 위에 얹어 변조·검출을 시키는 갈래. 아주 얇아 빠르고 저전력이지만, <b>웨이퍼 단위로 균일하게 얹는 공정<\/b>이 아직 어렵다.","PCM 광메모리":"상변화물질을 도파관 위에 얹어 <b>빛으로 쓰고 빛으로 읽는<\/b> 비휘발성 메모리. 전원이 없어도 값이 남아서, 신경망 가중치를 광회로에 고정해두는 in-memory 연산의 바탕이 된다.","자유공간 광 신경망":"칩 속 도파관이 아니라 <b>공기 중을 지나는 빛<\/b>으로 행렬 곱을 하는 방식. 렌즈·공간광변조기(SLM)로 수천~수만 채널을 한 번에 다루니 병렬성이 크고, 대신 부피가 크고 정렬이 까다롭다.","PCM 광연산":"PCM에 저장한 가중치를 통과시키는 것만으로 곱셈-누적이 끝나게 만드는 연산. <b>메모리와 연산이 같은 자리<\/b>에 있어 데이터를 실어 나르는 비용이 사라진다.","BTO 극저온 EO":"바륨티타네이트(BaTiO₃)는 <b>포켈스 효과가 아주 강한<\/b> 재료라 낮은 전압으로 초고속 변조가 된다. 극저온에서도 동작한다는 게 확인돼서, 초전도 회로와 광 신호를 잇는 자리에 쓰인다.","집적 광양자":"단일 광자를 칩 위 회로에서 만들고 간섭시켜 양자 연산을 하는 갈래. 광컴퓨팅과 재료·공정은 겹치지만 <b>목표가 다르다<\/b>(연산 가속이 아니라 양자 정보).","나노가공 시설":"연구용 클린룸. 전자빔 리소그래피처럼 소량·고정밀 가공을 해서, 파운드리 표준 공정으로는 못 만드는 구조를 시험 제작한다.","에피택시·반도체 광원":"기판 위에 반도체 결정층을 원자 단위로 쌓아 올리는 공정(MBE·MOVPE). 실리콘은 빛을 못 내니 <b>빛을 내는 III-V 결정층<\/b>을 따로 길러 얹어야 하고, 그 결정을 공급하는 자리.","InP 레이저·변조기":"인듐인(InP)은 <b>직접 천이형 반도체라 빛을 잘 낸다<\/b> — 레이저와 고속 변조기의 주재료. 대신 실리콘만큼 저손실 회로를 만들기 어려워서, 보통 실리콘 회로에 붙이는 식으로 쓴다.","양자증폭기·나노광학":"양자 잡음 한계 근처에서 신호를 키우거나 나노 구조로 빛을 가두는 물리 연구. 광컴퓨팅·통신과는 갈래가 다르다.","photonic BiCMOS":"고속 전자 회로(SiGe 바이폴라 + CMOS)와 광 소자를 <b>같은 웨이퍼에 한 번에<\/b> 찍는 공정. 전자와 광이 붙어 있어 기생 성분이 작고 효율이 좋지만, 공정 개발이 어려워 이걸 개방한 곳은 유럽에서 IHP 하나뿐이다.","집적포토닉스·유기EO":"유기 전기광학 고분자를 실리콘·플라즈모닉 구조의 좁은 틈에 채워 <b>아주 낮은 전압으로 초고속 변조<\/b>를 얻는 방식. 성능은 뛰어나지만 재료의 장기 안정성이 과제.","뉴로모픽·PCM":"뇌의 시냅스처럼 <b>값을 기억하는 소자<\/b>로 신경망을 구성하는 갈래. 광 쪽에서는 PCM이 그 시냅스 역할을 한다.","그룹IV 레이저":"실리콘 계열 재료만으로 레이저를 만드는 시도. 이 재료들은 원래 빛을 잘 못 내는데, 게르마늄에 주석을 섞어(GeSn) 밴드 구조를 바꾸면 발광이 가능해진다 — <b>온칩 광원 문제의 정공법<\/b>.","Ge/GeSn 검출기":"게르마늄 계열로 만든 광검출기. 실리콘이 못 보는 <b>통신 파장과 중적외선<\/b>을 흡수해 전류로 바꾸고, CMOS 공정과 호환된다.","TFLN 광 가속기":"박막 리튬나이오베이트 회로로 행렬 곱을 수행하는 연산 장치. 포켈스 효과 덕에 <b>손실 없이 빠르게<\/b> 값을 바꿀 수 있어 아날로그 연산에 유리하다.","광연산 이론":"소자를 만들지 않고 <b>어떤 물리 과정이 어떤 계산에 해당하는지<\/b>를 수식으로 규명하는 쪽. 예를 들어 선형 산란만으로 비선형 연산을 얻는 방법 같은 것.","양자통신·계산 포토닉스":"양자 키 분배 같은 통신용 집적광학과, 소자를 수치로 푸는 시뮬레이션 연구. 광컴퓨팅 소자 제작과는 축이 다르다.","커스텀 나노가공":"표준 MPW로는 못 만드는 <b>비표준 구조를 소량으로<\/b> 만들어주는 위탁 제작. 전자빔·나노임프린트를 함께 쓴다.","zero-change EPIC":"광 소자를 위해 공정을 <b>하나도 바꾸지 않고<\/b> 기존 상용 CMOS 공정 안에서 뽑아내는 방식. 만들 수 있는 구조는 제한되지만, 최신 전자 공정의 발전을 그대로 얻고 대량 생산으로 바로 간다.","모놀리식 CMOS 포토닉스":"전자와 광을 한 칩에 함께 집적하는 갈래. 둘 사이 배선이 짧아 전력과 지연이 줄지만, 두 공정의 요구가 충돌해 설계가 까다롭다.","전자-광 집적":"트랜지스터와 광 소자를 한 시스템으로 묶는 넓은 의미의 연구. 마이크로프로세서에 광 입출력을 직접 붙이는 작업이 대표적이다.","모놀리식 선형대수 가속기":"행렬 곱을 수행하는 광 코어를 한 칩에 집적하되, <b>전기↔광 변환에 드는 에너지·면적·보정까지 계산에 넣어<\/b> 설계하는 접근. 광 코어만 빠르고 변환에서 손해 보는 문제를 정면으로 다룬다.","TFLN 웨이퍼 집적":"TFLN을 실험실 수준이 아니라 <b>웨이퍼 단위로 실리콘 회로에 접합<\/b>하는 공정 연구. 이게 되어야 TFLN이 양산 플랫폼이 된다.","TFLN 나노광학":"TFLN에 광결정 같은 미세 구조를 새겨 <b>빛을 극도로 좁은 부피에 가두는<\/b> 연구. 부피가 작아질수록 같은 변조에 드는 전압과 에너지가 줄어든다.","광 텐서코어·PCM":"PCM 메모리 배열과 파장 다중화를 결합해 <b>합성곱을 한 번에 병렬로<\/b> 처리하는 연산 코어. 2021년 Nature 논문이 이 축의 기준점이다.","이종집적 레이저":"실리콘 위에 InP 같은 다른 반도체를 <b>붙이거나 전사해<\/b> 레이저를 얹는 방식. 실리콘이 빛을 못 내는 문제의 현재 주류 해법이고, 이미 양산에 들어가 있다.","공용 MPW 파운드리":"여러 사용자의 설계를 한 웨이퍼에 모아 찍어 비용을 나누는 서비스. <b>이게 있어야 학생도 칩을 만든다<\/b> — 이 분야의 진입 장벽 그 자체.","수출통제":"기술·정보의 국외 이전을 제한하는 제도(ITAR·EAR 등). 연구 자체보다 <b>어떤 문서를 볼 수 있고 어떤 회의에 들어갈 수 있나<\/b>를 가른다.","광 리저버·공간광 신경망":"복잡하게 얽힌 광 매질을 <b>학습시키지 않고 그대로 두고<\/b> 출력단만 훈련하는 방식(리저버 컴퓨팅). 자유공간 광학과 결합하면 아주 많은 노드를 값싸게 얻는다.","BTO·플라즈모닉 변조기":"BaTiO₃와 금속 나노구조를 결합해 <b>빛을 파장보다 작은 영역에 압축<\/b>해 변조하는 소자. 200 GBd급 속도가 나오지만 금속 손실이 대가.","마이크로콤":"작은 광 공진기에서 <b>등간격 파장 여러 개를 한꺼번에<\/b> 만들어내는 광원. 파장 하나당 한 채널을 쓰는 광 연산·통신에서 광원 수를 줄여준다.","프로그래머블 PIC":"간섭계 격자를 전기로 조절해 <b>한 칩으로 여러 기능을 수행<\/b>하게 만드는 광회로. FPGA의 광학판에 해당한다.","광양자 회로":"유리나 칩 안에 도파관을 새겨 단일 광자를 간섭시키는 회로. 펨토초 레이저로 유리 내부에 3차원 경로를 직접 쓰기도 한다.","폴라리톤·초고체 빛":"빛과 물질이 강하게 결합해 생기는 준입자(폴라리톤) 연구. 빛끼리 상호작용하게 만들 수 있어, <b>디지털 광연산의 우회로<\/b> 중 하나로 꼽힌다.","양자 포토닉스·클린룸":"양자 광원·회로 연구와 그걸 만드는 가공 시설이 함께 있는 거점.","해당 PI 없음":"이 축(EO·팹리스)에 해당하는 연구자를 이번 조사에서 찾지 못했다는 뜻. 기관이 약하다는 게 아니라 <b>힘이 다른 분야에 있다<\/b>는 뜻이다."},"UI":{"title":"기관 지도","intro":"EO(전자-광 하이브리드)를 축으로 그린 광 연산 기관 지도. 마커를 누르면 그 기관의 PI·팹·연결이 여기에 열린다.","warn":"<b>이 숫자는 「조사량」이지 「실제 규모」가 아니다.<\/b> 2026-10-01 전수 조사로 75 → 124기관이 됐는데, 늘어난 36곳 중 대부분이 원래 있었지만 기존 조사 방법이 못 잡던 것이었다 — 기존 조사가 「영국·서유럽·미국」으로 범위를 한정해 캐나다·호주가 0이었고, 미국은 NSF만 실측해 국방 자금축이 통째로 빠졌으며, 학회는 ECIO 하나만 전수라 유럽이 과대였다. 지금도 OFC는 753편 중 75편(10%)만 열었다. 남은 빈칸은 「거기 없다」가 아니라 「아직 안 봤다」로 읽어야 한다.","mapnote":"2026-10-01 · {n}기관 · 원 크기 = 주제 거리","PN":{"uk":"광학 UKRI 진행 £25.10M = 사우샘프턴","de":"모놀리식 전자-광은 IHP 하나","us":"zero-change 계보 · 국적 게이트는 CUI에","fr":"브장송 = 공간광 신경망","it":"집적 PIC · 광양자 · 폴라리톤","au":"COMBS A$34.9M · CSIRO 패키징 센터 2026 개소 · MPW 셔틀은 없다","eu2":"학회 채굴로 드러난 구멍 — Ghent·Eindhoven·Tyndall·Valencia","as":"칩은 여기서 가장 많이 찍힌다 · 홍콩 HKPFS 마감 12/1","ch":"EO 재료의 남은 구멍"}}}</script>
